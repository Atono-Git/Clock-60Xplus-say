<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock_60X 放送設定</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial, "Noto Sans JP", sans-serif;
}

button,
input {
    font: inherit;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    color: #fff;
    background: #18548a;
    cursor: pointer;
}

button:hover {
    background: #226ba9;
}

input {
    width: 100%;
    padding: 12px;
    background: #292929;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    outline: none;
}

input:focus {
    border-color: #438bd0;
}

header {
    padding: 18px;
    text-align: center;
    background: #181818;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

/* =========================
   部屋参加
========================= */

#joinScreen {
    max-width: 520px;
    margin: 60px auto;
}

.join-title {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 25px;
}

.join-box {
    padding: 25px;
    background: #1d1d1d;
    border-radius: 15px;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    color: #bbb;
}

#joinButton {
    width: 100%;
    font-size: 18px;
    padding: 15px;
}

#joinStatus {
    margin-top: 15px;
    min-height: 25px;
    padding: 10px;
    background: #111;
    border-radius: 8px;
    white-space: pre-wrap;
}

/* =========================
   アプリ
========================= */

#appScreen {
    display: none;
}

/* =========================
   接続情報
========================= */

.connection {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    margin-bottom: 18px;
    background: #1d1d1d;
    border-radius: 12px;
}

.connection-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.connection-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #777;
}

.connection-dot.online {
    background: #39c172;
    box-shadow: 0 0 8px rgba(57, 193, 114, 0.7);
}

.room-number {
    font-weight: bold;
    font-size: 18px;
}

.connection-status {
    margin-top: 3px;
    color: #aaa;
    font-size: 14px;
}

.leave-button {
    background: #682929;
}

.leave-button:hover {
    background: #893636;
}

/* =========================
   Clock
========================= */

.clock-panel {
    margin-bottom: 18px;
    padding: 25px;
    text-align: center;
    background: #181818;
    border-radius: 15px;
}

.clock {
    font-size: clamp(52px, 11vw, 100px);
    font-weight: bold;
    letter-spacing: 4px;
    line-height: 1;
}

.clock-status {
    margin-top: 14px;
    color: #aaa;
    font-size: 18px;
}

/* =========================
   放送設定一覧
========================= */

.panel {
    margin-bottom: 18px;
    padding: 22px;
    background: #1d1d1d;
    border-radius: 15px;
}

.panel-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.panel-title h2 {
    margin: 0;
    font-size: 23px;
}

.add-button {
    background: #28613c;
}

.add-button:hover {
    background: #347a4b;
}

/* =========================
   放送カード
========================= */

.announcement-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.announcement-card {
    padding: 18px;
    background: #292929;
    border-radius: 14px;
    border: 1px solid #3a3a3a;
}

.announcement-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
}

.announcement-number {
    font-size: 18px;
    font-weight: bold;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

/* =========================
   ON/OFF
========================= */

.switch {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #ccc;
    font-size: 14px;
    cursor: pointer;
}

.switch input {
    width: 20px;
    height: 20px;
    cursor: pointer;
}

/* =========================
   時刻
========================= */

.time-area {
    margin-bottom: 18px;
}

.time-label {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 7px;
}

.time-input {
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    letter-spacing: 2px;
    padding: 14px;
}

/* =========================
   放送内容
========================= */

.card-fields {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.card-field {
    margin-bottom: 14px;
}

.card-field label {
    display: block;
    color: #aaa;
    font-size: 14px;
    margin-bottom: 6px;
}

/* =========================
   ラジオ
========================= */

.radio-title {
    color: #aaa;
    margin-bottom: 7px;
}

.radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-bottom: 14px;
}

.radio-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 13px;
    background: #181818;
    border-radius: 9px;
    cursor: pointer;
}

.radio-item input {
    width: auto;
}

/* =========================
   プレビュー
========================= */

.preview {
    margin-top: 16px;
    padding: 14px;
    background: #111;
    border-radius: 10px;
    border: 1px solid #3b3b3b;
}

.preview-title {
    color: #777;
    font-size: 13px;
    margin-bottom: 7px;
}

.preview-text {
    line-height: 1.8;
}

/* =========================
   削除
========================= */

.delete-button {
    background: #682929;
}

.delete-button:hover {
    background: #893636;
}

/* =========================
   保存
========================= */

.save-status {
    margin-top: 10px;
    color: #67cf91;
    min-height: 20px;
}

/* =========================
   空状態
========================= */

.empty-message {
    padding: 25px;
    text-align: center;
    color: #777;
    background: #111;
    border-radius: 10px;
}

/* =========================
   スマホ
========================= */

@media (max-width: 700px) {

    .connection {
        flex-direction: column;
        align-items: stretch;
    }

    .leave-button {
        width: 100%;
    }

    .card-fields {
        grid-template-columns: 1fr;
    }

    .announcement-header {
        align-items: flex-start;
    }

    .header-actions {
        flex-wrap: wrap;
    }

    .panel-title {
        flex-direction: column;
        align-items: stretch;
    }

    .add-button {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>Clock_60X 放送設定</h1>
</header>


<!-- ================================
     部屋参加
================================ -->

<div id="joinScreen" class="container">

    <div class="join-title">
        部屋に参加
    </div>

    <div class="join-box">

        <div class="field">
            <label for="roomCode">
                5桁の部屋番号
            </label>

            <input
                id="roomCode"
                type="text"
                inputmode="numeric"
                maxlength="5"
                placeholder="例：42540"
                autocomplete="off"
            >
        </div>

        <div class="field">
            <label for="roomPassword">
                パスワード
            </label>

            <input
                id="roomPassword"
                type="password"
                placeholder="パスワード"
                autocomplete="off"
            >
        </div>

        <button id="joinButton">
            部屋に参加
        </button>

        <div id="joinStatus"></div>

    </div>
</div>


<!-- ================================
     アプリ本体
================================ -->

<div id="appScreen" class="container">

    <div class="connection">

        <div class="connection-left">

            <div
                id="connectionDot"
                class="connection-dot"
            ></div>

            <div>
                <div class="room-number">
                    部屋 <span id="currentRoom">-----</span>
                </div>

                <div
                    id="connectionStatus"
                    class="connection-status"
                >
                    接続中...
                </div>
            </div>

        </div>

        <button
            id="leaveButton"
            class="leave-button"
        >
            部屋から退出
        </button>

    </div>


    <!-- ================================
         Clock
    ================================= -->

    <div class="clock-panel">

        <div
            id="clock"
            class="clock"
        >
            --:--:--
        </div>

        <div
            id="clockStatus"
            class="clock-status"
        >
            時計情報を取得中...
        </div>

    </div>


    <!-- ================================
         放送設定
    ================================= -->

    <div class="panel">

        <div class="panel-title">

            <h2>
                放送設定
            </h2>

            <button
                id="addAnnouncementButton"
                class="add-button"
            >
                ＋ 放送設定を追加
            </button>

        </div>


        <div
            id="announcementList"
            class="announcement-list"
        ></div>


        <div
            id="saveStatus"
            class="save-status"
        ></div>

    </div>

</div>


<script type="module">


/* =========================================
   Firebase
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyACeTgCIWyynzbHcbdPLfeK24nnOjEvOJk",

    authDomain:
        "clock-60x.firebaseapp.com",

    projectId:
        "clock-60x",

    storageBucket:
        "clock-60x.firebasestorage.app",

    messagingSenderId:
        "311438870758",

    appId:
        "1:311438870758:web:41d7ec11bad3c924965327",

    measurementId:
        "G-JXQN631WTB"

};


const app =
    initializeApp(
        firebaseConfig
    );

const db =
    getFirestore(
        app
    );


/* =========================================
   DOM
========================================= */

const joinScreen =
    document.getElementById("joinScreen");

const appScreen =
    document.getElementById("appScreen");

const roomCodeInput =
    document.getElementById("roomCode");

const roomPasswordInput =
    document.getElementById("roomPassword");

const joinButton =
    document.getElementById("joinButton");

const joinStatus =
    document.getElementById("joinStatus");

const currentRoom =
    document.getElementById("currentRoom");

const connectionDot =
    document.getElementById("connectionDot");

const connectionStatus =
    document.getElementById("connectionStatus");

const leaveButton =
    document.getElementById("leaveButton");

const clock =
    document.getElementById("clock");

const clockStatus =
    document.getElementById("clockStatus");

const announcementList =
    document.getElementById("announcementList");

const addAnnouncementButton =
    document.getElementById(
        "addAnnouncementButton"
    );

const saveStatus =
    document.getElementById("saveStatus");


/* =========================================
   状態
========================================= */

let joinedRoomCode = null;

let roomData = null;

let unsubscribeRoom = null;

let announcements = [];


/* =========================================
   保存キー
   部屋ごとに完全分離
========================================= */

function getStorageKey() {

    return (
        "clock60x-say-" +
        joinedRoomCode
    );

}


/* =========================================
   新しい放送設定
========================================= */

function createAnnouncement() {

    return {

        id:
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2),

        enabled:
            true,

        time:
            "05:00:00",

        station:
            "",

        operation:
            "",

        type:
            "",

        timeType:
            "発車時刻",

        instruction:
            "列車を駅に待機させてください"

    };

}


/* =========================================
   放送文作成
========================================= */

function getAnnouncementText(data) {

    const station =
        data.station || "駅名";

    const operation =
        data.operation || "運用番号";

    const type =
        data.type || "種別";


    return (
        "まもなく、" +
        station +
        "車庫、" +
        operation +
        type +
        "、「" +
        data.timeType +
        "」です。" +
        "「" +
        data.instruction +
        "」。"
    );

}


/* =========================================
   保存
========================================= */

function saveSettings() {

    if (!joinedRoomCode) {
        return;
    }


    localStorage.setItem(
        getStorageKey(),
        JSON.stringify(
            announcements
        )
    );


    saveStatus.textContent =
        "設定を保存しました";


    clearTimeout(
        saveSettings.timer
    );


    saveSettings.timer =
        setTimeout(
            () => {

                saveStatus.textContent =
                    "";

            },
            1200
        );

}


/* =========================================
   読み込み
========================================= */

function loadSettings() {

    const raw =
        localStorage.getItem(
            getStorageKey()
        );


    if (!raw) {

        announcements = [];

        renderAnnouncements();

        return;

    }


    try {

        const data =
            JSON.parse(
                raw
            );


        if (
            Array.isArray(data)
        ) {

            announcements =
                data.map(
                    item => ({

                        ...createAnnouncement(),

                        ...item

                    })
                );

        }
        else {

            announcements = [];

        }

    }
    catch (error) {

        console.error(
            "設定読み込みエラー:",
            error
        );

        announcements = [];

    }


    renderAnnouncements();

}


/* =========================================
   放送設定を描画
========================================= */

function renderAnnouncements() {

    announcementList.innerHTML =
        "";


    if (
        announcements.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "empty-message";

        empty.textContent =
            "まだ放送設定がありません。「＋ 放送設定を追加」から登録してください。";

        announcementList.appendChild(
            empty
        );

        return;

    }


    announcements.forEach(
        (announcement, index) => {

            const card =
                createAnnouncementCard(
                    announcement,
                    index
                );

            announcementList.appendChild(
                card
            );

        }
    );

}


/* =========================================
   カード作成
========================================= */

function createAnnouncementCard(
    data,
    index
) {

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "announcement-card";


    /* -------------------------
       ヘッダー
    ------------------------- */

    const header =
        document.createElement(
            "div"
        );

    header.className =
        "announcement-header";


    const number =
        document.createElement(
            "div"
        );

    number.className =
        "announcement-number";

    number.textContent =
        "放送設定 " +
        (index + 1);


    const actions =
        document.createElement(
            "div"
        );

    actions.className =
        "header-actions";


    /* ON/OFF */

    const switchLabel =
        document.createElement(
            "label"
        );

    switchLabel.className =
        "switch";


    const checkbox =
        document.createElement(
            "input"
        );

    checkbox.type =
        "checkbox";

    checkbox.checked =
        data.enabled;


    const switchText =
        document.createElement(
            "span"
        );

    switchText.textContent =
        "有効";


    checkbox.addEventListener(
        "change",
        () => {

            data.enabled =
                checkbox.checked;

            saveSettings();

        }
    );


    switchLabel.appendChild(
        checkbox
    );

    switchLabel.appendChild(
        switchText
    );


    /* 削除 */

    const deleteButton =
        document.createElement(
            "button"
        );

    deleteButton.className =
        "delete-button";

    deleteButton.textContent =
        "削除";


    deleteButton.addEventListener(
        "click",
        () => {

            announcements =
                announcements.filter(
                    item =>
                        item.id !==
                        data.id
                );

            saveSettings();

            renderAnnouncements();

        }
    );


    actions.appendChild(
        switchLabel
    );

    actions.appendChild(
        deleteButton
    );


    header.appendChild(
        number
    );

    header.appendChild(
        actions
    );


    card.appendChild(
        header
    );


    /* -------------------------
       時刻
    ------------------------- */

    const timeArea =
        document.createElement(
            "div"
        );

    timeArea.className =
        "time-area";


    const timeLabel =
        document.createElement(
            "div"
        );

    timeLabel.className =
        "time-label";

    timeLabel.textContent =
        "通知時刻";


    const timeInput =
        document.createElement(
            "input"
        );

    timeInput.type =
        "time";

    timeInput.step =
        "1";

    timeInput.className =
        "time-input";

    timeInput.value =
        normalizeTime(
            data.time
        );


    timeInput.addEventListener(
        "change",
        () => {

            data.time =
                timeInput.value ||
                "05:00:00";

            saveSettings();

        }
    );


    timeArea.appendChild(
        timeLabel
    );

    timeArea.appendChild(
        timeInput
    );


    card.appendChild(
        timeArea
    );


    /* -------------------------
       3項目
    ------------------------- */

    const fields =
        document.createElement(
            "div"
        );

    fields.className =
        "card-fields";


    createInputField(
        fields,
        "駅名",
        data.station,
        "例：千葉",
        value => {

            data.station =
                value;

            updateCardPreview(
                data,
                previewText
            );

            saveSettings();

        }
    );


    createInputField(
        fields,
        "運用番号",
        data.operation,
        "例：A101",
        value => {

            data.operation =
                value;

            updateCardPreview(
                data,
                previewText
            );

            saveSettings();

        }
    );


    createInputField(
        fields,
        "種別",
        data.type,
        "例：普通",
        value => {

            data.type =
                value;

            updateCardPreview(
                data,
                previewText
            );

            saveSettings();

        }
    );


    card.appendChild(
        fields
    );


    /* -------------------------
       時刻種別
    ------------------------- */

    const timeTypeTitle =
        document.createElement(
            "div"
        );

    timeTypeTitle.className =
        "radio-title";

    timeTypeTitle.textContent =
        "時刻種別";


    card.appendChild(
        timeTypeTitle
    );


    const timeTypeGroup =
        document.createElement(
            "div"
        );

    timeTypeGroup.className =
        "radio-group";


    createRadio(
        timeTypeGroup,
        "発車時刻",
        data.timeType,
        checked => {

            if (checked) {

                data.timeType =
                    "発車時刻";

                updateCardPreview(
                    data,
                    previewText
                );

                saveSettings();

            }

        }
    );


    createRadio(
        timeTypeGroup,
        "入庫時刻",
        data.timeType,
        checked => {

            if (checked) {

                data.timeType =
                    "入庫時刻";

                updateCardPreview(
                    data,
                    previewText
                );

                saveSettings();

            }

        }
    );


    card.appendChild(
        timeTypeGroup
    );


    /* -------------------------
       指示内容
    ------------------------- */

    const instructionTitle =
        document.createElement(
            "div"
        );

    instructionTitle.className =
        "radio-title";

    instructionTitle.textContent =
        "指示内容";


    card.appendChild(
        instructionTitle
    );


    const instructionGroup =
        document.createElement(
            "div"
        );

    instructionGroup.className =
        "radio-group";


    createRadio(
        instructionGroup,
        "列車を駅に待機させてください",
        data.instruction,
        checked => {

            if (checked) {

                data.instruction =
                    "列車を駅に待機させてください";

                updateCardPreview(
                    data,
                    previewText
                );

                saveSettings();

            }

        }
    );


    createRadio(
        instructionGroup,
        "各駅員、列車の位置を共有してください",
        data.instruction,
        checked => {

            if (checked) {

                data.instruction =
                    "各駅員、列車の位置を共有してください";

                updateCardPreview(
                    data,
                    previewText
                );

                saveSettings();

            }

        }
    );


    card.appendChild(
        instructionGroup
    );


    /* -------------------------
       プレビュー
    ------------------------- */

    const preview =
        document.createElement(
            "div"
        );

    preview.className =
        "preview";


    const previewTitle =
        document.createElement(
            "div"
        );

    previewTitle.className =
        "preview-title";

    previewTitle.textContent =
        "この設定で放送される文章";


    const previewText =
        document.createElement(
            "div"
        );

    previewText.className =
        "preview-text";


    updateCardPreview(
        data,
        previewText
    );


    preview.appendChild(
        previewTitle
    );

    preview.appendChild(
        previewText
    );


    card.appendChild(
        preview
    );


    return card;

}


/* =========================================
   入力欄作成
========================================= */

function createInputField(
    parent,
    labelText,
    value,
    placeholder,
    onChange
) {

    const field =
        document.createElement(
            "div"
        );

    field.className =
        "card-field";


    const label =
        document.createElement(
            "label"
        );

    label.textContent =
        labelText;


    const input =
        document.createElement(
            "input"
        );

    input.type =
        "text";

    input.value =
        value || "";

    input.placeholder =
        placeholder;


    input.addEventListener(
        "input",
        () => {

            onChange(
                input.value
            );

        }
    );


    field.appendChild(
        label
    );

    field.appendChild(
        input
    );


    parent.appendChild(
        field
    );

}


/* =========================================
   ラジオ作成
========================================= */

function createRadio(
    parent,
    text,
    currentValue,
    onChange
) {

    const label =
        document.createElement(
            "label"
        );

    label.className =
        "radio-item";


    const input =
        document.createElement(
            "input"
        );

    input.type =
        "radio";

    input.name =
        "radio-" +
        Math.random();


    /*
       nameを同じグループにするため、
       親ごとの一時IDを作る
    */

    if (!parent.dataset.radioName) {

        parent.dataset.radioName =
            "group-" +
            Date.now() +
            "-" +
            Math.random();

    }


    input.name =
        parent.dataset.radioName;


    input.value =
        text;

    input.checked =
        currentValue === text;


    input.addEventListener(
        "change",
        () => {

            onChange(
                input.checked
            );

        }
    );


    const span =
        document.createElement(
            "span"
        );

    span.textContent =
        text;


    label.appendChild(
        input
    );

    label.appendChild(
        span
    );


    parent.appendChild(
        label
    );

}


/* =========================================
   プレビュー更新
========================================= */

function updateCardPreview(
    data,
    element
) {

    element.textContent =
        getAnnouncementText(
            data
        );

}


/* =========================================
   時刻整形
========================================= */

function normalizeTime(time) {

    if (
        typeof time !== "string"
    ) {

        return "05:00:00";

    }


    const parts =
        time.split(":");


    if (
        parts.length === 2
    ) {

        return time + ":00";

    }


    if (
        parts.length === 3
    ) {

        return time;

    }


    return "05:00:00";

}


/* =========================================
   時計表示
========================================= */

function formatTime(seconds) {

    seconds =
        Math.floor(
            Number(seconds)
        );


    if (
        !Number.isFinite(seconds)
    ) {

        return "--:--:--";

    }


    seconds =
        (
            (seconds % 86400) +
            86400
        ) % 86400;


    const h =
        Math.floor(
            seconds / 3600
        );

    const m =
        Math.floor(
            (seconds % 3600) / 60
        );

    const s =
        seconds % 60;


    return (
        String(h).padStart(2, "0") +
        ":" +
        String(m).padStart(2, "0") +
        ":" +
        String(s).padStart(2, "0")
    );

}


/* =========================================
   Clock更新
========================================= */

function updateClock() {

    if (!roomData) {
        return;
    }


    const seconds =
        Number(
            roomData.virtualSeconds
        );


    clock.textContent =
        formatTime(
            seconds
        );


    const running =
        Boolean(
            roomData.running
        );


    const speed =
        Number(
            roomData.speed || 1
        );


    clockStatus.textContent =
        running
            ? "Clock_60X運転中 ・ " +
              speed +
              "倍速"
            : "Clock_60X停止中";

}


/* =========================================
   放送設定追加
========================================= */

addAnnouncementButton.addEventListener(
    "click",
    () => {

        announcements.push(
            createAnnouncement()
        );


        saveSettings();

        renderAnnouncements();


        setTimeout(
            () => {

                const cards =
                    document.querySelectorAll(
                        ".announcement-card"
                    );


                const lastCard =
                    cards[
                        cards.length - 1
                    ];


                if (lastCard) {

                    lastCard.scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });

                }

            },
            50
        );

    }
);


/* =========================================
   部屋参加
========================================= */

joinButton.addEventListener(
    "click",
    async () => {

        const roomCode =
            roomCodeInput.value.trim();

        const password =
            roomPasswordInput.value;


        if (
            !/^\d{5}$/.test(
                roomCode
            )
        ) {

            joinStatus.textContent =
                "部屋番号は5桁の数字で入力してください。";

            joinStatus.style.color =
                "#ff6b6b";

            return;

        }


        if (
            password.trim() === ""
        ) {

            joinStatus.textContent =
                "パスワードを入力してください。";

            joinStatus.style.color =
                "#ff6b6b";

            return;

        }


        joinButton.disabled =
            true;

        joinButton.textContent =
            "接続中...";


        joinStatus.textContent =
            "部屋を確認しています...";

        joinStatus.style.color =
            "#aaa";


        try {

            const roomRef =
                doc(
                    db,
                    "rooms",
                    roomCode
                );


            const snapshot =
                await getDoc(
                    roomRef
                );


            if (
                !snapshot.exists()
            ) {

                joinStatus.textContent =
                    "その部屋は存在しません。";

                joinStatus.style.color =
                    "#ff6b6b";

                return;

            }


            const data =
                snapshot.data();


            if (
                data.password !==
                password
            ) {

                joinStatus.textContent =
                    "パスワードが違います。";

                joinStatus.style.color =
                    "#ff6b6b";

                return;

            }


            /* 参加成功 */

            joinedRoomCode =
                roomCode;


            roomData =
                data;


            currentRoom.textContent =
                roomCode;


            joinScreen.style.display =
                "none";


            appScreen.style.display =
                "block";


            connectionDot.classList.add(
                "online"
            );


            connectionStatus.textContent =
                "Clock_60Xと同期中";


            loadSettings();


            if (
                unsubscribeRoom
            ) {

                unsubscribeRoom();

            }


            unsubscribeRoom =
                onSnapshot(
                    roomRef,

                    snapshot => {

                        if (
                            !snapshot.exists()
                        ) {

                            connectionDot.classList.remove(
                                "online"
                            );

                            connectionStatus.textContent =
                                "部屋が削除されました";

                            return;

                        }


                        roomData =
                            snapshot.data();


                        updateClock();

                    },

                    error => {

                        console.error(
                            "Firestore監視エラー:",
                            error
                        );


                        connectionDot.classList.remove(
                            "online"
                        );


                        connectionStatus.textContent =
                            "接続エラー";

                    }
                );


            updateClock();

        }
        catch (error) {

            console.error(
                "部屋参加エラー:",
                error
            );


            joinStatus.textContent =
                "接続エラー\n\n" +
                error.message;

            joinStatus.style.color =
                "#ff6b6b";

        }
        finally {

            joinButton.disabled =
                false;

            joinButton.textContent =
                "部屋に参加";

        }

    }
);


/* =========================================
   Enterキー
========================================= */

roomPasswordInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            joinButton.click();

        }

    }
);


/* =========================================
   部屋退出
========================================= */

leaveButton.addEventListener(
    "click",
    () => {

        if (
            unsubscribeRoom
        ) {

            unsubscribeRoom();

            unsubscribeRoom =
                null;

        }


        joinedRoomCode =
            null;

        roomData =
            null;

        announcements =
            [];


        appScreen.style.display =
            "none";

        joinScreen.style.display =
            "block";


        roomCodeInput.value =
            "";

        roomPasswordInput.value =
            "";


        connectionDot.classList.remove(
            "online"
        );


        clock.textContent =
            "--:--:--";


        clockStatus.textContent =
            "時計情報を取得中...";


        connectionStatus.textContent =
            "接続中...";

    }
);


/* =========================================
   初期状態
========================================= */

renderAnnouncements();

</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Clock_60X 放送設定</title>

<style>

/* =========================================================
   基本
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    background: #111;
    color: #fff;

    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}


/* =========================================================
   ヘッダー
========================================================= */

header {
    padding: 18px;

    background: #181818;

    border-bottom: 1px solid #333;

    text-align: center;
}

header h1 {
    margin: 0;

    font-size: 27px;
}


/* =========================================================
   コンテナ
========================================================= */

.container {
    width: 100%;

    max-width: 980px;

    margin: 0 auto;

    padding: 20px;
}


/* =========================================================
   部屋参加
========================================================= */

#joinScreen {
    max-width: 520px;

    margin: 60px auto;
}

.join-title {
    margin-bottom: 25px;

    text-align: center;

    font-size: 30px;

    font-weight: bold;
}

.join-box {
    padding: 25px;

    background: #1d1d1d;

    border-radius: 15px;
}

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;

    margin-bottom: 7px;

    color: #bbb;
}

input,
textarea,
select {
    width: 100%;

    padding: 12px;

    background: #292929;

    color: #fff;

    border:
        1px solid
        #444;

    border-radius: 8px;

    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #438bd0;
}

textarea {
    min-height: 120px;

    resize: vertical;

    line-height: 1.6;
}

select {
    cursor: pointer;
}

#joinButton {
    width: 100%;

    padding: 15px;

    background: #18548a;

    color: #fff;

    border: none;

    border-radius: 10px;

    font-size: 19px;

    cursor: pointer;
}

#joinButton:hover {
    background: #226ba9;
}

#joinButton:disabled {
    opacity: 0.5;

    cursor: default;
}

#joinStatus {
    min-height: 24px;

    margin-top: 15px;

    padding: 10px;

    background: #111;

    border-radius: 8px;

    white-space: pre-wrap;
}


/* =========================================================
   アプリ
========================================================= */

#appScreen {
    display: none;
}


/* =========================================================
   接続情報
========================================================= */

.connection {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    margin-bottom: 18px;

    padding: 14px 16px;

    background: #1d1d1d;

    border-radius: 12px;
}

.connection-left {

    display: flex;

    align-items: center;

    gap: 10px;
}

.connection-dot {

    width: 12px;
    height: 12px;

    flex-shrink: 0;

    background: #777;

    border-radius: 50%;
}

.connection-dot.online {

    background: #39c172;

    box-shadow:
        0 0 8px
        rgba(57, 193, 114, 0.7);
}

.room-number {

    font-size: 18px;

    font-weight: bold;
}

.connection-status {

    margin-top: 3px;

    color: #aaa;

    font-size: 14px;
}

.leave-button {

    padding: 12px 18px;

    background: #682929;

    color: #fff;

    border: none;

    border-radius: 10px;

    cursor: pointer;
}

.leave-button:hover {
    background: #893636;
}


/* =========================================================
   時計
========================================================= */

.clock-panel {

    margin-bottom: 18px;

    padding: 25px;

    background: #181818;

    border-radius: 15px;

    text-align: center;
}

.clock {

    font-size:
        clamp(52px, 11vw, 100px);

    font-weight: bold;

    letter-spacing: 4px;

    line-height: 1;
}

.clock-status {

    margin-top: 14px;

    color: #aaa;

    font-size: 18px;
}


/* =========================================================
   放送設定
========================================================= */

.panel {

    margin-bottom: 18px;

    padding: 22px;

    background: #1d1d1d;

    border-radius: 15px;
}

.panel-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;

    margin-bottom: 18px;
}

.panel-title h2 {

    margin: 0;

    font-size: 23px;
}

.add-button {

    padding: 12px 18px;

    background: #28613c;

    color: #fff;

    border: none;

    border-radius: 10px;

    cursor: pointer;
}

.add-button:hover {
    background: #347a4b;
}


/* =========================================================
   設定一覧
========================================================= */

.announcement-list {

    display: flex;

    flex-direction: column;

    gap: 16px;
}


/* =========================================================
   1つの放送設定
========================================================= */

.announcement-card {

    padding: 18px;

    background: #292929;

    border:
        1px solid
        #3b3b3b;

    border-radius: 14px;

    transition:
        border-color 0.2s,
        box-shadow 0.2s,
        background 0.2s;
}


/*
    現在放送中の設定。
*/
.announcement-card.speaking {

    border-color: #e7b93b;

    box-shadow:
        0 0 18px
        rgba(231, 185, 59, 0.25);

    background: #332f20;
}


/*
    直近に読み上げた設定。
*/
.announcement-card.spoken {

    border-color: #3c7655;
}


/* =========================================================
   カードヘッダー
========================================================= */

.announcement-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 18px;
}

.announcement-number {

    font-size: 19px;

    font-weight: bold;
}

.header-right {

    display: flex;

    align-items: center;

    gap: 10px;
}


/* =========================================================
   状態表示
========================================================= */

.announcement-status {

    padding:
        5px
        9px;

    background: #181818;

    border-radius: 7px;

    color: #aaa;

    font-size: 12px;
}


/*
    放送中
*/
.announcement-status.speaking {

    background: #695717;

    color: #ffe58c;
}


/*
    読み上げ済み
*/
.announcement-status.spoken {

    background: #1e4931;

    color: #8ee6aa;
}


/* =========================================================
   ON / OFF
========================================================= */

.switch {

    display: flex;

    align-items: center;

    gap: 7px;

    color: #ccc;

    cursor: pointer;
}

.switch input {

    width: 20px;
    height: 20px;

    cursor: pointer;
}


/* =========================================================
   ラベル
========================================================= */

.setting-label {

    margin-bottom: 7px;

    color: #aaa;

    font-size: 14px;
}


/* =========================================================
   時刻
========================================================= */

.time-area {

    margin-bottom: 18px;
}

.time-input {

    font-size: 28px;

    font-weight: bold;

    letter-spacing: 2px;

    text-align: center;
}


/* =========================================================
   コメント方式
========================================================= */

.mode-buttons {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-bottom: 18px;
}

.mode-button {

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 14px;

    background: #181818;

    border:
        1px solid
        #444;

    border-radius: 10px;

    cursor: pointer;

    user-select: none;
}

.mode-button.active {

    background: #18548a;

    border-color: #438bd0;
}

.mode-button input {

    display: none;
}


/* =========================================================
   定型文
========================================================= */

.template-area {

    padding: 16px;

    background: #222;

    border-radius: 10px;
}

.template-fields {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}

.card-field {

    margin-bottom: 14px;
}

.card-field label {

    display: block;

    margin-bottom: 6px;

    color: #aaa;

    font-size: 14px;
}


/* =========================================================
   選択ボタン
========================================================= */

.choice-area {

    margin-top: 10px;
}

.choice-title {

    margin-bottom: 8px;

    color: #aaa;

    font-size: 14px;
}

.choice-buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-bottom: 15px;
}

.choice-button {

    padding:
        10px
        13px;

    background: #181818;

    color: #fff;

    border:
        1px solid
        #444;

    border-radius: 9px;

    cursor: pointer;
}

.choice-button:hover {

    background: #303030;
}

.choice-button.active {

    background: #18548a;

    border-color: #438bd0;
}


/* =========================================================
   自由入力
========================================================= */

.free-comment {

    margin-top: 5px;
}


/* =========================================================
   プレビュー
========================================================= */

.preview {

    margin-top: 16px;

    padding: 14px;

    background: #111;

    border:
        1px solid
        #383838;

    border-radius: 10px;
}

.preview-label {

    margin-bottom: 7px;

    color: #777;

    font-size: 13px;
}

.preview-text {

    line-height: 1.8;

    white-space: pre-wrap;

    word-break: break-word;
}


/* =========================================================
   音声設定
========================================================= */

.voice-panel {

    margin-top: 16px;

    padding: 16px;

    background: #222;

    border-radius: 10px;
}

.voice-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}

.voice-test-button {

    width: 100%;

    margin-top: 12px;

    background: #4a4a4a;
}

.voice-test-button:hover {

    background: #5b5b5b;
}


/* =========================================================
   削除
========================================================= */

.delete-button {

    padding: 10px 15px;

    background: #682929;

    color: #fff;

    border: none;

    border-radius: 10px;

    cursor: pointer;
}

.delete-button:hover {

    background: #893636;
}


/* =========================================================
   保存
========================================================= */

.save-status {

    min-height: 20px;

    margin-top: 10px;

    color: #67cf91;
}


/* =========================================================
   放送ログ
========================================================= */

.broadcast-log {

    margin-top: 18px;

    padding: 15px;

    background: #111;

    border-radius: 10px;
}

.broadcast-log-title {

    margin-bottom: 10px;

    color: #888;

    font-size: 13px;
}

.broadcast-log-list {

    display: flex;

    flex-direction: column;

    gap: 6px;
}

.log-item {

    padding: 8px 10px;

    background: #1c1c1c;

    border-radius: 7px;

    line-height: 1.5;

    font-size: 13px;
}

.log-time {

    color: #7db2e5;

    margin-right: 7px;
}


/* =========================================================
   空の状態
========================================================= */

.empty-message {

    padding: 25px;

    background: #111;

    border-radius: 10px;

    color: #777;

    text-align: center;

    line-height: 1.7;
}


/* =========================================================
   スマホ
========================================================= */

@media (max-width: 700px) {

    .connection {

        flex-direction: column;

        align-items: stretch;
    }

    .leave-button {

        width: 100%;
    }

    .panel-title {

        flex-direction: column;

        align-items: stretch;
    }

    .add-button {

        width: 100%;
    }

    .announcement-header {

        align-items: flex-start;
    }

    .header-right {

        flex-wrap: wrap;

        justify-content: flex-end;
    }

    .template-fields {

        grid-template-columns: 1fr;
    }

    .voice-grid {

        grid-template-columns: 1fr;
    }

}
</style>
</head>


<body>


<header>
    <h1>Clock_60X 放送設定</h1>

<!-- =====================================================
     部屋参加
===================================================== -->

<div

                        <option value="0.9">

</div>

/* =========================================================
   部屋ごとの保存キー
========================================================= */

function getStorageKey() {

    return (
        "clock60x-say-" +
        roomCode
    );

}


function getVoiceStorageKey() {

    return (
        "clock60x-say-voice-" +

    );

/* =========================================================
   新しい放送設定
========================================================= */

function createAnnouncement() {

    return {

        id:
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2),

        enabled:
            true,

        time:
            "05:00:00",

        mode:
            "template",

        station:
            "北春日部",

        operation:
            "L1",

        type:
            "普通",

        timeType:
            "発車時刻",

        instruction:
            "列車を駅に待機させてください",

        comment:
            ""

    };

}


/* =========================================================
   放送文章
========================================================= */

function getAnnouncementText(data) {


    /*
        自由入力
    */

    if (
        data.mode === "free"
    ) {

        if (
            data.comment &&
            data.comment.trim() !== ""
        ) {

            return data.comment;

        }


        return "コメントがまだ入力されていません。";

    }


    /*
        定型文
    */

    return (

        "まもなく、" +

        data.station +

        "車庫、" +

        data.operation +

        data.type +

        "、「" +

        data.timeType +

        "」です。" +

        "「" +

        data.instruction +

        "」。"

    );

}


/* =========================================================
   保存
========================================================= */

    if (!roomCode) {

        return;

    }


    localStorage.setItem(

        getStorageKey(),

        JSON.stringify(
            announcements
        )

    );


    saveStatus.textContent =
        "設定を保存しました";


    clearTimeout(
        saveAnnouncements.timer
    );


    saveAnnouncements.timer =
        setTimeout(
            () => {

                saveStatus.textContent =
                    "";

            },
            1000
        );

}


/* =========================================================
   読み込み
========================================================= */

function loadAnnouncements() {

    const raw =
        localStorage.getItem(
            getStorageKey()
        );


    if (!raw) {

        announcements = [];

        renderAnnouncements();

        return;

    }


    try {

        const data =
            JSON.parse(
                raw
            );


        if (
            !Array.isArray(data)
        ) {

            announcements = [];

        }
        else {

            announcements =
                data.map(
                    item => {

                        const base =
                            createAnnouncement();


                        return {

                            ...base,

                            ...item,

                            /*
                                新しい形式にない
                                値だけ初期値に戻す。
                            */

                            mode:
                                (
                                    item.mode === "free" ||
                                    item.mode === "template"
                                )
                                    ? item.mode
                                    : "template"

                        };

                    }
                );

        }

    }
    catch (error) {

        console.error(
            "放送設定読み込みエラー:",
            error
        );


        announcements = [];

    }


    renderAnnouncements();

}


/* =========================================================
   時刻の正規化
========================================================= */

function normalizeTime(time) {

    if (
        typeof time !== "string"
    ) {

        return "05:00:00";

    }


    const parts =
        time.split(":");


    if (
        parts.length === 2
    ) {

        return (
            time +
            ":00"
        );

    }


    if (
        parts.length === 3
    ) {

        return time;

    }


    return "05:00:00";

}


/* =========================================================
   SELECT作成
========================================================= */

function createSelectField(
    parent,
    labelText,
    options,
    currentValue,
    onChange
) {

    const field =
        document.createElement(
            "div"
        );


    field.className =
        "card-field";


    const label =
        document.createElement(
            "label"
        );


    label.textContent =
        labelText;


    const select =
        document.createElement(
            "select"
        );


    options.forEach(
        value => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                value;


            option.textContent =
                value;


            if (
                value ===
                currentValue
            ) {

                option.selected =
                    true;

            }


            select.appendChild(
                option
            );

        }
    );


    select.addEventListener(
        "change",
        () => {

            onChange(
                select.value
            );

        }
    );


    field.appendChild(
        label
    );


    field.appendChild(
        select
    );


    parent.appendChild(
        field
    );

}


/* =========================================================
   選択ボタン作成
========================================================= */

function createChoiceButton(
    parent,
    text,
    currentValue,
    onChange
) {

    const button =
        document.createElement(
            "button"
        );


    button.type =
        "button";


    button.className =
        "choice-button";


    if (
        text ===
        currentValue
    ) {

        button.classList.add(
            "active"
        );

    }


    button.textContent =
        text;


    button.addEventListener(
        "click",
        () => {


            parent
                .querySelectorAll(
                    ".choice-button"
                )
                .forEach(
                    other => {

                            "active"
                        );

                    }
                );


            button.classList.add(

            );


            onChange(

        }
    );


    parent.appendChild(
        button
    );

/* =========================================================
   Clock表示
========================================================= */

function formatClockTime(seconds) {

    const value =
        Math.floor(
            Number(
                seconds
            )
        );


    if (
        !Number.isFinite(
            value
        )
    ) {

        return "--:--:--";

    }


    const normalized =
        (
            (value % 86400) +
            86400
        ) % 86400;


    const hours =
        Math.floor(
            normalized / 3600
        );


    const minutes =
        Math.floor(
            (normalized % 3600) / 60
        );


    const secs =
        normalized % 60;


    return (

        String(
            hours
        ).padStart(2, "0")

        +

        ":"

        +

        String(
            minutes
        ).padStart(2, "0")

        +

        ":"

        +

        String(
            secs
        ).padStart(2, "0")

    );

}


/* =========================================================
   Clock更新
========================================================= */

function updateClock() {

    if (!roomData) {

        return;

    }


    /*
        まず画面の時計を更新
    */

    const currentSeconds =
        Number(
            roomData.virtualSeconds
        );


    clock.textContent =
        formatClockTime(
            currentSeconds
        );


    /*
        Clock_60Xの状態
    */

    const running =
        Boolean(
            roomData.running
        );


    const speed =
        Number(
            roomData.speed || 1
        );


    if (running) {

        clockStatus.textContent =
            "Clock_60X運転中 ・ " +
            speed +
            "倍速";

    }
    else {

        clockStatus.textContent =
            "Clock_60X停止中";

    }


    /*
        放送時刻判定
    */

    checkAnnouncements(
        currentSeconds
    );

}


/* =========================================================
   時刻文字列 → 秒
========================================================= */

function timeToSeconds(
    time
) {

    const parts =
        normalizeTime(
            time
        ).split(":");


    const h =
        Number(
            parts[0]
        );


    const m =
        Number(
            parts[1]
        );


    const s =
        Number(
            parts[2]
        );


    if (
        !Number.isFinite(h) ||
        !Number.isFinite(m) ||
        !Number.isFinite(s)
    ) {

        return null;

    }


    return (
        h * 3600 +
        m * 60 +
        s
    );

}


/* =========================================================
   放送判定
========================================================= */

function checkAnnouncements(
    currentSeconds
) {

    /*
        現在の時刻を
        0～86399秒にそろえる。
    */

    const now =
        (
            Math.floor(
                Number(
                    currentSeconds
                )
            ) % 86400 +
            86400
        ) % 86400;


    announcements.forEach(
        announcement => {


            /*
                OFFなら何もしない
            */

            if (
                !announcement.enabled
            ) {

                return;

            }


            const target =
                timeToSeconds(
                    announcement.time
                );


            if (
                target === null
            ) {

                return;

            }


            /*
                現在時刻と設定時刻が
                完全一致したとき。
            */

            if (
                now !== target
            ) {

                return;

            }


            /*
                1秒に複数回
                同じ放送を出さない。
            */

            const key =
                announcement.id +
                "-" +
                target;


            if (
                spokenKeys.has(
                    key
                )
            ) {

                return;

            }


            spokenKeys.add(
                key
            );


            /*
                放送実行
            */

            speakAnnouncement(
                announcement
            );

        }
    );



    /*
        古いspokenKeysが増えすぎないようにする。

        1周したらリセットできるように、
        virtualSecondsが0付近になったら
        今回はまとめてクリアする。
    */

    if (
        now <= 2
    ) {

        spokenKeys.clear();

    }

}


/* =========================================================
   読み上げ
========================================================= */

function speakAnnouncement(
    data
) {

    const text =
        getAnnouncementText(
            data
        );


    if (
        !text ||
        text.trim() === ""
    ) {

        return;

    }


    /*
        現在読み上げ中として表示
    */

    speakingIds.add(
        data.id
    );


    renderAnnouncements();


    /*
        ログへ追加
    */

    addBroadcastLog(
        text
    );


    /*
        SpeechSynthesisUtteranceを作成
    */

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    /*
        日本語として読み上げる。
    */

    utterance.lang =
        "ja-JP";


    /*
        ユーザーが選択した音声
    */

    const selectedVoiceName =
        voiceSelect.value;


    const selectedVoice =
        voices.find(
            voice =>
                voice.name ===
                selectedVoiceName
        );


    if (
        selectedVoice
    ) {

        utterance.voice =
            selectedVoice;

    }


    /*
        読み上げ速度
    */

    utterance.rate =
        Number(
            voiceRate.value
        );


    /*
        声の高さ
    */

    utterance.pitch =
        Number(
            voicePitch.value
        );


    /*
        音量

        1 = 最大
    */

    utterance.volume =
        1.0;


    /*
        読み上げ終了時
    */

    utterance.onend =
        () => {

            speakingIds.delete(
                data.id
            );


            renderAnnouncements();

        };


    /*
        エラー時も状態を戻す
    */

    utterance.onerror =
        error => {

            console.error(
                "読み上げエラー:",
                error
            );


            speakingIds.delete(
                data.id
            );


            renderAnnouncements();

        };


    /*
        音声再生。

        近い時刻の放送も
        それぞれここへ追加する。
    */

    window.speechSynthesis.speak(
        utterance
    );

}

/* =========================================================
   音声一覧を読み込む
========================================================= */

function loadVoices() {

    voices =
        window.speechSynthesis.getVoices();


    voiceSelect.innerHTML =
        "";


    /*
        日本語音声を先にする
    */

    const sorted =
        [...voices].sort(
            (a, b) => {

                const aJa =
                    a.lang
                        .toLowerCase()
                        .startsWith(
                            "ja"
                        );


                const bJa =
                    b.lang
                        .toLowerCase()
                        .startsWith(
                            "ja"
                        );


                if (
                    aJa &&
                    !bJa
                ) {

                    return -1;

                }


                if (
                    !aJa &&
                    bJa
                ) {

                    return 1;

                }


                return 0;

            }
        );


    sorted.forEach(
        voice => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                voice.name;


            option.textContent =
                voice.name +
                " (" +
                voice.lang +
                ")";


            voiceSelect.appendChild(
                option
            );

        }
    );


    /*
        日本語音声があれば自動選択
    */

    const japaneseVoice =
        sorted.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .startsWith(
                        "ja"
                    )
        );


    if (
        japaneseVoice
    ) {

        voiceSelect.value =
            japaneseVoice.name;

    }


    loadVoiceSettings();

}


/* =========================================================
   音声設定を保存
========================================================= */

function saveVoiceSettings() {

    if (!roomCode) {

        return;

    }


    localStorage.setItem(

        getVoiceStorageKey(),

        JSON.stringify({

            voice:
                voiceSelect.value,

            rate:
                voiceRate.value,

            pitch:
                voicePitch.value

        })

    );

}


/* =========================================================
   音声設定を読み込み
========================================================= */

function loadVoiceSettings() {

    if (!roomCode) {

        return;

    }


    const raw =
        localStorage.getItem(
            getVoiceStorageKey()
        );


    if (!raw) {

        return;

    }


    try {

        const settings =
            JSON.parse(
                raw
            );


        if (
            settings.rate
        ) {

            voiceRate.value =
                settings.rate;

        }


        if (
            settings.pitch
        ) {

            voicePitch.value =
                settings.pitch;

        }


        if (
            settings.voice
        ) {

            const exists =
                [...voiceSelect.options]
                    .some(
                        option =>
                            option.value ===
                            settings.voice
                    );


            if (
                exists
            ) {

                voiceSelect.value =
                    settings.voice;

            }

        }

    }
    catch (error) {

        console.error(
            "音声設定読み込みエラー:",
            error
        );

    }

}


/* =========================================================
   放送ログ
========================================================= */

function addBroadcastLog(
    text
) {

    const now =
        formatClockTime(
            roomData
                ? roomData.virtualSeconds
                : 0
        );


    broadcastLogs.unshift({

        time:
            now,

        text:
            text

    });


    /*
        最大10件
    */

    if (
        broadcastLogs.length >
        10
    ) {

        broadcastLogs =
            broadcastLogs.slice(
                0,
                10
            );

    }


    renderBroadcastLogs();

}


/* =========================================================
   ログ描画
========================================================= */

function renderBroadcastLogs() {

    broadcastLogList.innerHTML =
        "";


    if (
        broadcastLogs.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "log-item";


        empty.textContent =
            "まだ放送されていません。";


        broadcastLogList.appendChild(
            empty
        );


        return;

    }


    broadcastLogs.forEach(
        log => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "log-item";


            const time =
                document.createElement(
                    "span"
                );


            time.className =
                "log-time";


            time.textContent =
                "[" +
                log.time +
                "]";


            const text =
                document.createElement(
                    "span"
                );


            text.textContent =
                log.text;


            item.appendChild(
                time
            );


            item.appendChild(
                text
            );


            broadcastLogList.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   音声テスト
========================================================= */

voiceTestButton.addEventListener(
    "click",
    () => {

        testVoice();

    }
);


/* 音声設定変更 */

voiceSelect.addEventListener(
    "change",
    saveVoiceSettings
);


voiceRate.addEventListener(
    "change",
    saveVoiceSettings
);


voicePitch.addEventListener(
    "change",
    saveVoiceSettings
);


/* =========================================================
   放送設定追加
========================================================= */

addAnnouncementButton.addEventListener(
    "click",
    () => {

        announcements.push(
            createAnnouncement()
        );


        saveAnnouncements();


        renderAnnouncements();


        setTimeout(
            () => {

                const cards =
                    document.querySelectorAll(
                        ".announcement-card"
                    );


                const last =
                    cards[
                        cards.length - 1
                    ];


                if (
                    last
                ) {

                    last.scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });

                }

            },
            100
        );

    }
);


/* =========================================================
   部屋参加
========================================================= */

joinButton.addEventListener(
    "click",
    async () => {


        const inputRoomCode =
            roomCodeInput.value.trim();


        const password =
            roomPasswordInput.value;


        /*
            部屋番号チェック
        */

        if (
            !/^\d{5}$/.test(
                inputRoomCode
            )
        ) {

            joinStatus.textContent =
                "部屋番号は5桁の数字で入力してください。";


            joinStatus.style.color =
                "#ff6b6b";


            return;

        }


        /*
            パスワード
        */

        if (
            password === ""
        ) {

            joinStatus.textContent =
                "パスワードを入力してください。";


            joinStatus.style.color =
                "#ff6b6b";


            return;

        }


        joinButton.disabled =
            true;


        joinButton.textContent =
            "接続中...";


        joinStatus.textContent =
            "部屋を確認しています...";


        joinStatus.style.color =
            "#aaa";


        try {


            /*
                元のClock_60Xと同じ
                rooms/{部屋番号}
            */

            const roomRef =
                doc(
                    db,
                    "rooms",
                    inputRoomCode
                );


            /*
                部屋取得
            */

            const snapshot =
                await getDoc(
                    roomRef
                );


            /*
                存在確認
            */

            if (
                !snapshot.exists()
            ) {

                joinStatus.textContent =
                    "部屋が存在しません。";


                joinStatus.style.color =
                    "#ff6b6b";


                return;

            }


            /*
                データ
            */

            const data =
                snapshot.data();


            /*
                パスワード
            */

            if (
                data.password !==
                password
            ) {

                joinStatus.textContent =
                    "パスワードが違います。";


                joinStatus.style.color =
                    "#ff6b6b";


                return;

            }


            /*
                ==============================
                参加成功
                ==============================
            */

            roomCode =
                inputRoomCode;


            roomData =
                data;


            currentRoom.textContent =
                roomCode;


            /*
                参加画面を隠す
            */

            joinScreen.style.display =
                "none";


            /*
                アプリ表示
            */

            appScreen.style.display =
                "block";


            /*
                接続表示
            */

            connectionDot.classList.add(
                "online"
            );


            connectionStatus.textContent =
                "Clock_60Xと同期中";


            /*
                設定読み込み
            */

            loadAnnouncements();


            /*
                音声一覧
            */

            loadVoices();


            /*
                時計初期表示
            */

            updateClock();


            /*
                以前の監視を解除
            */

            if (
                unsubscribeRoom
            ) {

                unsubscribeRoom();


                unsubscribeRoom =
                    null;

            }


            /*
                Clock_60Xを監視
            */

            unsubscribeRoom =
                onSnapshot(

                    roomRef,

                    snapshot => {


                        /*
                            部屋が消えた
                        */

                        if (
                            !snapshot.exists()
                        ) {

                            connectionDot.classList.remove(
                                "online"
                            );


                            connectionStatus.textContent =
                                "部屋が削除されました";


                            return;

                        }


                        /*
                            最新データ
                        */

                        roomData =
                            snapshot.data();


                        /*
                            接続中
                        */

                        connectionDot.classList.add(
                            "online"
                        );


                        connectionStatus.textContent =
                            "Clock_60Xと同期中";


                        /*
                            時計＋放送判定
                        */

                        updateClock();

                    },

                    error => {


                        console.error(
                            "Firestore監視エラー:",
                            error
                        );


                        connectionDot.classList.remove(
                            "online"
                        );


                        connectionStatus.textContent =
                            "接続エラー";

                    }

                );


        }
        catch (error) {


            console.error(
                "部屋参加エラー:",
                error
            );


            joinStatus.textContent =
                "接続エラー\n\n" +
                error.message;


            joinStatus.style.color =
                "#ff6b6b";

        }
        finally {


            joinButton.disabled =
                false;


            joinButton.textContent =
                "部屋に参加";

        }

    }
);


/* =========================================================
   Enter
========================================================= */

roomPasswordInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            joinButton.click();

        }

    }
);


/* =========================================================
   退出
========================================================= */

leaveButton.addEventListener(
    "click",
    () => {


        if (
            unsubscribeRoom
        ) {

            unsubscribeRoom();


            unsubscribeRoom =
                null;

        }


        /*
            SpeechSynthesis停止
        */

        window.speechSynthesis.cancel();


        roomCode =
            null;


        roomData =
            null;


        announcements =
            [];


        spokenKeys.clear();


        speakingIds.clear();


        joinScreen.style.display =
            "block";


        appScreen.style.display =
            "none";


        roomCodeInput.value =
            "";


        roomPasswordInput.value =
            "";


        connectionDot.classList.remove(
            "online"
        );


        connectionStatus.textContent =
            "接続中...";


        clock.textContent =
            "--:--:--";


        clockStatus.textContent =
            "Clock_60Xの時刻を取得中...";


        renderAnnouncements();

    }
);


/* =========================================================
   音声一覧が後から読み込まれた場合
========================================================= */

if (
    "speechSynthesis" in window
) {

    /*
        ブラウザによっては
        ページロード直後にはvoicesが空で、
        voiceschangedイベント後に取得できる。
    */

    window.speechSynthesis.onvoiceschanged =
        loadVoices;

}
else {

    voiceSelect.innerHTML =
        "<option>音声読み上げ非対応</option>";

}


/* =========================================================
   初期化
========================================================= */

renderAnnouncements();

renderBroadcastLogs();

</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock_60X 放送設定</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, "Noto Sans JP", sans-serif;
}

button,
input {
    font: inherit;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 20px;
    background: #18548a;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #226ba9;
}

button:disabled {
    opacity: 0.5;
    cursor: default;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #444;
    border-radius: 8px;
    background: #292929;
    color: white;
    outline: none;
}

input:focus {
    border-color: #438bd0;
}

label {
    display: block;
    color: #bbb;
    margin-bottom: 7px;
}

/* ===============================
   ヘッダー
================================ */

header {
    padding: 18px;
    text-align: center;
    background: #181818;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

/* ===============================
   コンテナ
================================ */

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

/* ===============================
   部屋参加
================================ */

#joinScreen {
    max-width: 520px;
    margin: 60px auto;
}

.join-title {
    font-size: 30px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
}

.join-box {
    background: #1d1d1d;
    border-radius: 15px;
    padding: 25px;
}

.field {
    margin-bottom: 18px;
}

#joinButton {
    width: 100%;
    font-size: 19px;
    padding: 15px;
}

#joinStatus {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    background: #111;
    white-space: pre-wrap;
    min-height: 25px;
}

/* ===============================
   アプリ
================================ */

#appScreen {
    display: none;
}

/* ===============================
   接続情報
================================ */

.connection {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #1d1d1d;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 18px;
}

.connection-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.connection-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #777;
}

.connection-dot.online {
    background: #39c172;
    box-shadow: 0 0 8px rgba(57, 193, 114, 0.7);
}

.room-number {
    font-size: 18px;
    font-weight: bold;
}

.connection-status {
    font-size: 14px;
    color: #aaa;
}

.leave-button {
    background: #682929;
}

.leave-button:hover {
    background: #893636;
}

/* ===============================
   Clock
================================ */

.clock-panel {
    background: #181818;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    margin-bottom: 18px;
}

.clock {
    font-size: clamp(52px, 11vw, 100px);
    font-weight: bold;
    letter-spacing: 4px;
    line-height: 1;
}

.clock-status {
    margin-top: 14px;
    color: #aaa;
    font-size: 18px;
}

/* ===============================
   設定パネル
================================ */

.panel {
    background: #1d1d1d;
    border-radius: 15px;
    padding: 22px;
    margin-bottom: 18px;
}

.panel h2 {
    margin: 0 0 18px 0;
    font-size: 23px;
}

/* ===============================
   3項目
================================ */

.fields {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

/* ===============================
   ラジオ
================================ */

.radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.radio-item {
    display: flex;
    align-items: center;
    gap: 7px;
    background: #292929;
    padding: 12px 14px;
    border-radius: 9px;
    cursor: pointer;
}

.radio-item input {
    width: auto;
}

/* ===============================
   放送文プレビュー
================================ */

.preview {
    margin-top: 18px;
    padding: 16px;
    border-radius: 10px;
    background: #111;
    border: 1px solid #333;
}

.preview-title {
    color: #888;
    font-size: 13px;
    margin-bottom: 7px;
}

.preview-text {
    line-height: 1.8;
}

/* ===============================
   通知
================================ */

.notification-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.notification-row {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    gap: 10px;
    background: #292929;
    padding: 10px;
    border-radius: 10px;
}

.notification-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
}

.delete-button {
    background: #682929;
}

.delete-button:hover {
    background: #893636;
}

.add-button {
    width: 100%;
    margin-top: 12px;
    background: #28613c;
}

.add-button:hover {
    background: #347a4b;
}

/* ===============================
   保存表示
================================ */

.save-status {
    margin-top: 12px;
    color: #67cf91;
    min-height: 20px;
}

/* ===============================
   スマホ
================================ */

@media (max-width: 700px) {
    .fields {
        grid-template-columns: 1fr;
    }

    .connection {
        flex-direction: column;
        align-items: stretch;
    }

    .leave-button {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>Clock_60X 放送設定</h1>
</header>

<!-- =====================================
     部屋参加
===================================== -->

<div id="joinScreen" class="container">

    <div class="join-title">
        部屋に参加
    </div>

    <div class="join-box">

        <div class="field">
            <label for="roomCode">5桁の部屋番号</label>

            <input
                id="roomCode"
                type="text"
                inputmode="numeric"
                maxlength="5"
                placeholder="例：42540"
                autocomplete="off"
            >
        </div>

        <div class="field">
            <label for="roomPassword">パスワード</label>

            <input
                id="roomPassword"
                type="password"
                placeholder="パスワード"
                autocomplete="off"
            >
        </div>

        <button id="joinButton">
            部屋に参加
        </button>

        <div id="joinStatus"></div>

    </div>
</div>

<!-- =====================================
     本体
===================================== -->

<div id="appScreen" class="container">

    <!-- 接続状態 -->

    <div class="connection">

        <div class="connection-left">

            <div
                id="connectionDot"
                class="connection-dot"
            ></div>

            <div>

                <div class="room-number">
                    部屋 <span id="currentRoom">-----</span>
                </div>

                <div
                    id="connectionStatus"
                    class="connection-status"
                >
                    接続中...
                </div>

            </div>

        </div>

        <button
            id="leaveButton"
            class="leave-button"
        >
            部屋から退出
        </button>

    </div>

    <!-- Clock -->

    <div class="clock-panel">

        <div
            id="clock"
            class="clock"
        >
            --:--:--
        </div>

        <div
            id="clockStatus"
            class="clock-status"
        >
            時計情報を取得中...
        </div>

    </div>

    <!-- =================================
         放送基本設定
    ================================== -->

    <div class="panel">

        <h2>
            放送設定
        </h2>

        <div class="fields">

            <div class="field">

                <label for="station">
                    駅名
                </label>

                <input
                    id="station"
                    type="text"
                    placeholder="例：千葉"
                >

            </div>

            <div class="field">

                <label for="operation">
                    運用番号
                </label>

                <input
                    id="operation"
                    type="text"
                    placeholder="例：A101"
                >

            </div>

            <div class="field">

                <label for="type">
                    種別
                </label>

                <input
                    id="type"
                    type="text"
                    placeholder="例：普通"
                >

            </div>

        </div>

        <label style="margin-top: 4px;">
            時刻種別
        </label>

        <div class="radio-group">

            <label class="radio-item">

                <input
                    type="radio"
                    name="timeType"
                    value="発車時刻"
                    checked
                >

                発車時刻

            </label>

            <label class="radio-item">

                <input
                    type="radio"
                    name="timeType"
                    value="入庫時刻"
                >

                入庫時刻

            </label>

        </div>

        <label style="margin-top: 18px;">
            指示内容
        </label>

        <div class="radio-group">

            <label class="radio-item">

                <input
                    type="radio"
                    name="instruction"
                    value="列車を駅に待機させてください"
                    checked
                >

                列車を駅に待機させてください

            </label>

            <label class="radio-item">

                <input
                    type="radio"
                    name="instruction"
                    value="各駅員、列車の位置を共有してください"
                >

                各駅員、列車の位置を共有してください

            </label>

        </div>

        <div class="preview">

            <div class="preview-title">
                放送文プレビュー
            </div>

            <div
                id="previewText"
                class="preview-text"
            ></div>

        </div>

        <div
            id="saveStatus"
            class="save-status"
        ></div>

    </div>

    <!-- =================================
         通知設定
    ================================== -->

    <div class="panel">

        <h2>
            通知時刻
        </h2>

        <div
            id="notificationList"
            class="notification-list"
        ></div>

        <button
            id="addNotificationButton"
            class="add-button"
        >
            ＋ 通知を追加
        </button>

    </div>

</div>


<script type="module">

/* =========================================
   Firebase
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyACeTgCIWyynzbHcbdPLfeK24nnOjEvOJk",

    authDomain:
        "clock-60x.firebaseapp.com",

    projectId:
        "clock-60x",

    storageBucket:
        "clock-60x.firebasestorage.app",

    messagingSenderId:
        "311438870758",

    appId:
        "1:311438870758:web:41d7ec11bad3c924965327",

    measurementId:
        "G-JXQN631WTB"
};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(
        app
    );


/* =========================================
   DOM
========================================= */

const joinScreen =
    document.getElementById(
        "joinScreen"
    );

const appScreen =
    document.getElementById(
        "appScreen"
    );

const roomCodeInput =
    document.getElementById(
        "roomCode"
    );

const roomPasswordInput =
    document.getElementById(
        "roomPassword"
    );

const joinButton =
    document.getElementById(
        "joinButton"
    );

const joinStatus =
    document.getElementById(
        "joinStatus"
    );

const currentRoom =
    document.getElementById(
        "currentRoom"
    );

const connectionDot =
    document.getElementById(
        "connectionDot"
    );

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const leaveButton =
    document.getElementById(
        "leaveButton"
    );

const clock =
    document.getElementById(
        "clock"
    );

const clockStatus =
    document.getElementById(
        "clockStatus"
    );

const stationInput =
    document.getElementById(
        "station"
    );

const operationInput =
    document.getElementById(
        "operation"
    );

const typeInput =
    document.getElementById(
        "type"
    );

const previewText =
    document.getElementById(
        "previewText"
    );

const saveStatus =
    document.getElementById(
        "saveStatus"
    );

const notificationList =
    document.getElementById(
        "notificationList"
    );

const addNotificationButton =
    document.getElementById(
        "addNotificationButton"
    );


/* =========================================
   状態
========================================= */

let unsubscribeRoom = null;

let joinedRoomCode = null;

let roomData = null;

let notifications = [];


/* =========================================
   部屋ごとの保存キー
========================================= */

function getStorageKey() {

    return (
        "clock60x-announcer-" +
        joinedRoomCode
    );

}


/* =========================================
   ラジオ取得
========================================= */

function getRadioValue(name) {

    const element =
        document.querySelector(
            `input[name="${name}"]:checked`
        );

    return element
        ? element.value
        : "";

}


/* =========================================
   放送文
========================================= */

function getAnnouncementText() {

    const station =
        stationInput.value.trim();

    const operation =
        operationInput.value.trim();

    const type =
        typeInput.value.trim();

    const timeType =
        getRadioValue(
            "timeType"
        );

    const instruction =
        getRadioValue(
            "instruction"
        );


    return (
        "まもなく、" +
        station +
        "車庫、" +
        operation +
        type +
        "、「" +
        timeType +
        "」です。" +
        "「" +
        instruction +
        "」。"
    );

}


/* =========================================
   プレビュー
========================================= */

function updatePreview() {

    previewText.textContent =
        getAnnouncementText();

}


/* =========================================
   設定保存
========================================= */

function saveSettings() {

    if (!joinedRoomCode) {
        return;
    }


    const data = {

        station:
            stationInput.value,

        operation:
            operationInput.value,

        type:
            typeInput.value,

        timeType:
            getRadioValue(
                "timeType"
            ),

        instruction:
            getRadioValue(
                "instruction"
            ),

        notifications:
            notifications

    };


    localStorage.setItem(
        getStorageKey(),
        JSON.stringify(data)
    );


    saveStatus.textContent =
        "保存しました";


    setTimeout(
        () => {

            saveStatus.textContent =
                "";

        },
        1500
    );

}


/* =========================================
   設定読み込み
========================================= */

function loadSettings() {

    const raw =
        localStorage.getItem(
            getStorageKey()
        );


    notifications = [];


    if (!raw) {

        updatePreview();

        renderNotifications();

        return;

    }


    try {

        const data =
            JSON.parse(
                raw
            );


        stationInput.value =
            data.station || "";


        operationInput.value =
            data.operation || "";


        typeInput.value =
            data.type || "";


        const timeType =
            data.timeType ||
            "発車時刻";


        const timeTypeElement =
            document.querySelector(
                `input[name="timeType"][value="${CSS.escape(timeType)}"]`
            );


        if (timeTypeElement) {

            timeTypeElement.checked =
                true;

        }


        const instruction =
            data.instruction ||
            "列車を駅に待機させてください";


        const instructionElement =
            document.querySelector(
                `input[name="instruction"][value="${CSS.escape(instruction)}"]`
            );


        if (instructionElement) {

            instructionElement.checked =
                true;

        }


        if (
            Array.isArray(
                data.notifications
            )
        ) {

            notifications =
                data.notifications.map(
                    item => ({

                        id:
                            item.id ||
                            crypto.randomUUID(),

                        time:
                            typeof item.time ===
                            "string"
                                ? item.time
                                : "05:00",

                        enabled:
                            item.enabled !== false

                    })
                );

        }

    }
    catch (error) {

        console.error(
            "設定の読み込みに失敗しました:",
            error
        );

    }


    updatePreview();

    renderNotifications();

}


/* =========================================
   通知描画
========================================= */

function renderNotifications() {

    notificationList.innerHTML =
        "";


    notifications.forEach(
        notification => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "notification-row";


            const checkbox =
                document.createElement(
                    "input"
                );

            checkbox.type =
                "checkbox";

            checkbox.checked =
                notification.enabled;


            checkbox.addEventListener(
                "change",
                () => {

                    notification.enabled =
                        checkbox.checked;

                    saveSettings();

                }
            );


            const timeInput =
                document.createElement(
                    "input"
                );

            timeInput.type =
                "time";

            timeInput.step =
                "1";

            timeInput.value =
                notification.time;


            timeInput.addEventListener(
                "change",
                () => {

                    notification.time =
                        timeInput.value;

                    saveSettings();

                    renderNotifications();

                }
            );


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.textContent =
                "削除";

            deleteButton.className =
                "delete-button";


            deleteButton.addEventListener(
                "click",
                () => {

                    notifications =
                        notifications.filter(
                            item =>
                                item.id !==
                                notification.id
                        );


                    saveSettings();

                    renderNotifications();

                }
            );


            row.appendChild(
                checkbox
            );

            row.appendChild(
                timeInput
            );

            row.appendChild(
                deleteButton
            );


            notificationList.appendChild(
                row
            );

        }
    );

}


/* =========================================
   通知追加
========================================= */

addNotificationButton.addEventListener(
    "click",
    () => {

        notifications.push({

            id:
                crypto.randomUUID(),

            time:
                "05:00",

            enabled:
                true

        });


        saveSettings();

        renderNotifications();

    }
);


/* =========================================
   入力変更
========================================= */

stationInput.addEventListener(
    "input",
    () => {

        updatePreview();

        saveSettings();

    }
);


operationInput.addEventListener(
    "input",
    () => {

        updatePreview();

        saveSettings();

    }
);


typeInput.addEventListener(
    "input",
    () => {

        updatePreview();

        saveSettings();

    }
);


document
    .querySelectorAll(
        'input[name="timeType"], input[name="instruction"]'
    )
    .forEach(
        element => {

            element.addEventListener(
                "change",
                () => {

                    updatePreview();

                    saveSettings();

                }
            );

        }
    );


/* =========================================
   時計
========================================= */

function formatTime(seconds) {

    seconds =
        Math.floor(
            Number(seconds)
        );


    if (
        !Number.isFinite(
            seconds
        )
    ) {

        return "--:--:--";

    }


    seconds =
        ((seconds % 86400) + 86400) %
        86400;


    const hours =
        Math.floor(
            seconds / 3600
        );

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        seconds % 60;


    return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );

}


/* =========================================
   Clock更新
========================================= */

function updateClock() {

    if (!roomData) {
        return;
    }


    const seconds =
        Number(
            roomData.virtualSeconds
        );


    clock.textContent =
        formatTime(
            seconds
        );


    const running =
        Boolean(
            roomData.running
        );


    const speed =
        Number(
            roomData.speed || 1
        );


    clockStatus.textContent =
        running
            ? "Clock_60X運転中 ・ " +
              speed +
              "倍速"
            : "Clock_60X停止中";

}


/* =========================================
   部屋参加
========================================= */

joinButton.addEventListener(
    "click",
    async () => {

        const roomCode =
            roomCodeInput.value.trim();

        const password =
            roomPasswordInput.value;


        if (
            !/^\d{5}$/.test(
                roomCode
            )
        ) {

            joinStatus.textContent =
                "部屋番号は5桁の数字で入力してください。";

            joinStatus.style.color =
                "#ff6b6b";

            return;

        }


        if (
            password.trim() === ""
        ) {

            joinStatus.textContent =
                "パスワードを入力してください。";

            joinStatus.style.color =
                "#ff6b6b";

            return;

        }


        joinButton.disabled =
            true;

        joinButton.textContent =
            "接続中...";


        joinStatus.textContent =
            "部屋を確認しています...";

        joinStatus.style.color =
            "#aaa";


        try {

            const roomRef =
                doc(
                    db,
                    "rooms",
                    roomCode
                );


            const snapshot =
                await getDoc(
                    roomRef
                );


            if (
                !snapshot.exists()
            ) {

                joinStatus.textContent =
                    "その部屋は存在しません。";

                joinStatus.style.color =
                    "#ff6b6b";

                return;

            }


            const data =
                snapshot.data();


            if (
                data.password !==
                password
            ) {

                joinStatus.textContent =
                    "パスワードが違います。";

                joinStatus.style.color =
                    "#ff6b6b";

                return;

            }


            /* 参加成功 */

            joinedRoomCode =
                roomCode;


            roomData =
                data;


            currentRoom.textContent =
                roomCode;


            joinScreen.style.display =
                "none";


            appScreen.style.display =
                "block";


            connectionDot.classList.add(
                "online"
            );


            connectionStatus.textContent =
                "Clock_60Xと同期中";


            loadSettings();


            if (
                unsubscribeRoom
            ) {

                unsubscribeRoom();

            }


            unsubscribeRoom =
                onSnapshot(

                    roomRef,

                    snapshot => {

                        if (
                            !snapshot.exists()
                        ) {

                            connectionDot.classList.remove(
                                "online"
                            );

                            connectionStatus.textContent =
                                "部屋が削除されました";

                            return;

                        }


                        roomData =
                            snapshot.data();


                        updateClock();

                    },

                    error => {

                        console.error(
                            "Firestore監視エラー:",
                            error
                        );


                        connectionDot.classList.remove(
                            "online"
                        );


                        connectionStatus.textContent =
                            "接続エラー";

                    }

                );


            updateClock();

        }
        catch (error) {

            console.error(
                "部屋参加エラー:",
                error
            );


            joinStatus.textContent =
                "接続エラー\n\n" +
                error.message;

            joinStatus.style.color =
                "#ff6b6b";

        }
        finally {

            joinButton.disabled =
                false;

            joinButton.textContent =
                "部屋に参加";

        }

    }
);


/* =========================================
   Enter
========================================= */

roomPasswordInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            joinButton.click();

        }

    }
);


/* =========================================
   退出
========================================= */

leaveButton.addEventListener(
    "click",
    () => {

        if (
            unsubscribeRoom
        ) {

            unsubscribeRoom();

            unsubscribeRoom =
                null;

        }


        joinedRoomCode =
            null;


        roomData =
            null;


        appScreen.style.display =
            "none";


        joinScreen.style.display =
            "block";


        roomCodeInput.value =
            "";


        roomPasswordInput.value =
            "";


        connectionDot.classList.remove(
            "online"
        );


        clock.textContent =
            "--:--:--";


        clockStatus.textContent =
            "時計情報を取得中...";


        connectionStatus.textContent =
            "接続中...";

    }
);


/* =========================================
   初期化
========================================= */

updatePreview();

renderNotifications();

</script>

</body>
</html>

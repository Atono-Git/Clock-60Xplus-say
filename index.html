<style>
/* =========================================================
   基本設定
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    background: #111;
    color: white;

    font-family:
        Arial,
        "Noto Sans JP",
        sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}


/* =========================================================
   ヘッダー
========================================================= */

header {
    padding: 18px;

    background: #181818;

    text-align: center;
}

header h1 {
    margin: 0;

    font-size: 27px;
}


/* =========================================================
   共通コンテナ
========================================================= */

    width: 100%;

    padding: 20px;

   部屋参加画面
========================================================= */

    max-width: 520px;

.join-title {

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;

textarea,
select {
    width: 100%;

textarea:focus,

   アプリ画面
========================================================= */

.room-number {

}

.connection-status {
    margin-top: 3px;

/* 退出ボタン */

.leave-button {

/* =========================================================

========================================================= */

.clock-panel {

/* =========================================================

========================================================= */

.panel {

    padding: 22px;

/* =========================================================

.add-button {

.header-right {

/* =========================================================

.switch {

   ラベル

.time-area {

/* =========================================================
   コメント方式
========================================================= */

.mode-buttons {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-bottom: 18px;
}

.mode-button {
    display: flex;

    justify-content: center;

    padding: 14px;

    background: #181818;

}

.mode-button.active {
    background: #18548a;

    border-color: #438bd0;
}

.mode-button input {

}


/* =========================================================
   定型文エリア
========================================================= */

.template-area {
    padding: 16px;

    background: #222;

    border-radius: 10px;
}

.template-fields {
    display: grid;

    grid-template-columns:

    gap: 12px;
}

.card-field {
    margin-bottom: 14px;
}

.card-field label {
    display: block;

/* =========================================================

========================================================= */

.choice-area {

.choice-title {

.choice-buttons {

}

.choice-button:hover {

}

.choice-button.active {

}


/* =========================================================
   自由入力
========================================================= */

.free-comment {

}


/* =========================================================

========================================================= */

.preview {
    margin-top: 16px;

    background: #111;

    border:

}

.preview-label {

}

.preview-text {

/* =========================================================

========================================================= */

.delete-button {

}

.delete-button:hover {

}


/* =========================================================
   保存表示
========================================================= */

.save-status {

/* =========================================================
   設定なし
========================================================= */

.empty-message {
    padding: 25px;

    border-radius: 10px;

/* =========================================================

========================================================= */

@media (max-width: 700px) {

    .connection {

        justify-content: flex-end;

    }

}

<script type="module">


/* =========================================================
   Firebase
========================================================= */

/*
    Clock_60Xと同じFirebaseプロジェクトを使う。
*/
import {
    initializeApp
}
from
    "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


/*
    Firestoreの必要な機能だけ読み込む。
*/
import {
    getFirestore,
    doc,
    getDoc,
    onSnapshot
}
from
    "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


/* =========================================================
   Firebase設定
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyACeTgCIWyynzbHcbdPLfeK24nnOjEvOJk",

    authDomain:
        "clock-60x.firebaseapp.com",

    projectId:
        "clock-60x",

    storageBucket:
        "clock-60x.firebasestorage.app",

    messagingSenderId:
        "311438870758",

    appId:
        "1:311438870758:web:41d7ec11bad3c924965327",

    measurementId:
        "G-JXQN631WTB"

};


/*
    Firebaseを初期化
*/
const firebaseApp =
    initializeApp(
        firebaseConfig
    );


/*
    Firestoreへ接続
*/
const db =
    getFirestore(
        firebaseApp
    );


/* =========================================================
   DOM取得
========================================================= */

const joinScreen =
    document.getElementById(
        "joinScreen"
    );

const appScreen =
    document.getElementById(
        "appScreen"
    );

const roomCodeInput =
    document.getElementById(
        "roomCode"
    );

const roomPasswordInput =
    document.getElementById(
        "roomPassword"
    );

const joinButton =
    document.getElementById(
        "joinButton"
    );

const joinStatus =
    document.getElementById(
        "joinStatus"
    );

const currentRoom =
    document.getElementById(
        "currentRoom"
    );

const connectionDot =
    document.getElementById(
        "connectionDot"
    );

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const leaveButton =
    document.getElementById(
        "leaveButton"
    );

const clock =
    document.getElementById(
        "clock"
    );

const clockStatus =
    document.getElementById(
        "clockStatus"
    );

const announcementList =
    document.getElementById(
        "announcementList"
    );

const addAnnouncementButton =
    document.getElementById(
        "addAnnouncementButton"
    );

const saveStatus =
    document.getElementById(
        "saveStatus"
    );


/* =========================================================
   アプリ状態
========================================================= */

/*
    現在参加している部屋番号。
*/
let roomCode = null;


/*
    Clock_60Xから受信した最新データ。
*/
let roomData = null;


/*
    Firestore監視停止用。
*/
let unsubscribeRoom = null;


/*
    放送設定一覧。
*/
let announcements = [];


/* =========================================================
   選択肢
========================================================= */

/*
    車庫
*/
const STATIONS = [
    "北春日部",
    "北越谷",
    "竹ノ塚"
];


/*
    運用番号。

    すべて1個ずつ独立した選択肢。
*/
const OPERATIONS = [

    "L1",
    "L2",
    "L3",

    "TH",

    "E1",
    "E2",
    "E3",
    "E4",
    "E5",
    "E6",

    "S1",
    "S2",
    "S3",

    "LM1",
    "LM2",
    "LM3",
    "LM4",
    "LM5",
    "LM6",

    "EM1",
    "EM2"

];


/*
    種別
*/
const TYPES = [
    "回送",
    "普通",
    "急行",
    "特急",
    "TH"
];


/*
    時刻種別
*/
const TIME_TYPES = [
    "発車時刻",
    "入庫時刻"
];


/*
    指示内容
*/
const INSTRUCTIONS = [
    "列車を駅に待機させてください",
    "各駅員、列車の位置を共有してください"
];


/* =========================================================
   保存先
========================================================= */

/*
    部屋番号ごとに保存場所を分ける。

    42540なら

        clock60x-say-42540

    という保存キーになる。
*/
function getStorageKey() {

    return (
        "clock60x-say-" +
        roomCode
    );

}


/* =========================================================
   新しい放送設定
========================================================= */

function createAnnouncement() {

    return {

        id:
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2),

        /*
            初期状態はON
        */
        enabled:
            true,

        /*
            初期通知時刻
        */
        time:
            "05:00:00",

        /*
            最初は定型文
        */
        mode:
            "template",

        /*
            定型文の初期値
        */
        station:
            "北春日部",

        operation:
            "L1",

        type:
            "普通",

        timeType:
            "発車時刻",

        instruction:
            "列車を駅に待機させてください",

        /*
            自由入力欄
        */
        comment:
            ""

    };

}


/* =========================================================
   放送文を作成
========================================================= */

function getAnnouncementText(data) {

    /*
        自由入力
    */
    if (
        data.mode === "free"
    ) {

        if (
            data.comment &&
            data.comment.trim() !== ""
        ) {

            return data.comment;

        }


        return "コメントがまだ入力されていません。";

    }


    /*
        定型文

        まもなく、
        {車庫}車庫、
        {運用番号}{種別}、
        「{発車時刻/入庫時刻}」です。
        「{指示内容}」。
    */

    return (

        "まもなく、" +

        data.station +

        "車庫、" +

        data.operation +

        data.type +

        "、「" +

        data.timeType +

        "」です。" +

        "「" +

        data.instruction +

        "」。"

    );

}


/* =========================================================
   設定保存
========================================================= */

function saveAnnouncements() {

    /*
        部屋に参加していなければ保存しない
    */
    if (!roomCode) {

        return;

    }


    /*
        現在の設定をJSONとして保存
    */
    localStorage.setItem(

        getStorageKey(),

        JSON.stringify(
            announcements
        )

    );


    /*
        保存しました表示
    */
    saveStatus.textContent =
        "設定を保存しました";


    /*
        連続入力時に表示を消すタイマー
    */
    clearTimeout(
        saveAnnouncements.timer
    );


    saveAnnouncements.timer =
        setTimeout(
            () => {

                saveStatus.textContent =
                    "";

            },
            1200
        );

}


/* =========================================================
   設定読み込み
========================================================= */

function loadAnnouncements() {

    const raw =
        localStorage.getItem(
            getStorageKey()
        );


    /*
        保存データがなければ空
    */
    if (!raw) {

        announcements = [];

        renderAnnouncements();

        return;

    }


    try {

        const data =
            JSON.parse(
                raw
            );


        if (
            !Array.isArray(data)
        ) {

            announcements = [];

        }
        else {

            announcements =
                data.map(
                    item => {

                        /*
                            最新の初期値を作ってから
                            保存データを上書きする。

                            これによって、古いデータに
                            新しい項目がなくても壊れにくい。
                        */

                        return {

                            ...createAnnouncement(),

                            ...item,

                            /*
                                ここ重要。
                                modeがtemplate/free以外なら
                                定型文として扱う。
                            */
                            mode:
                                (
                                    item.mode === "free" ||
                                    item.mode === "template"
                                )
                                    ? item.mode
                                    : "template"

                        };

                    }
                );

        }

    }
    catch (error) {

        console.error(
            "放送設定の読み込みエラー:",
            error
        );

        announcements = [];

    }


    renderAnnouncements();

}


/* =========================================================
   時刻を整形
========================================================= */

function normalizeTime(time) {

    if (
        typeof time !== "string"
    ) {

        return "05:00:00";

    }


    const parts =
        time.split(":");


    /*
        HH:MMなら秒を追加
    */
    if (
        parts.length === 2
    ) {

        return (
            time +
            ":00"
        );

    }


    /*
        HH:MM:SS
    */
    if (
        parts.length === 3
    ) {

        return time;

    }


    return "05:00:00";

}


/* =========================================================
   放送設定一覧
========================================================= */

function renderAnnouncements() {

    /*
        画面を一旦空にする
    */
    announcementList.innerHTML =
        "";


    /*
        設定がまだない場合
    */
    if (
        announcements.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "empty-message";


        empty.textContent =
            "まだ放送設定がありません。" +
            "「＋ 放送設定を追加」から登録してください。";


        announcementList.appendChild(
            empty
        );


        return;

    }


    /*
        各設定をカード化
    */
    announcements.forEach(
        (data, index) => {

            const card =
                createAnnouncementCard(
                    data,
                    index
                );


            announcementList.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   放送設定カード
========================================================= */

function createAnnouncementCard(
    data,
    index
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "announcement-card";


    /* =====================================================
       ヘッダー
    ===================================================== */

    const header =
        document.createElement(
            "div"
        );


    header.className =
        "announcement-header";


    const title =
        document.createElement(
            "div"
        );


    title.className =

        );

        document.createElement(
            "input"
        );

            "span"
        );

        () => {

                        item.id !==

    ===================================================== */

    /* =====================================================
       プレビュー
    ===================================================== */

        document.createElement(
            "div"
        );


    previewBox.className =

    const previewLabel =
        document.createElement(
            "div"
        );


    previewLabel.className =
        "preview-label";


    previewLabel.textContent =
        "この設定で読み上げる内容";


    const previewText =
        document.createElement(
            "div"
        );


    previewText.className =
        "preview-text";


    previewBox.appendChild(
        previewLabel
    );


    previewBox.appendChild(
        previewText
    );


    card.appendChild(
        previewBox
    );


    /* =====================================================
       モード表示更新
    ===================================================== */

    function updateModeDisplay() {

        const templateMode =
            data.mode ===
            "template";


        /*
            定型文なら定型文エリアを表示
        */
        templateArea.style.display =
            templateMode
                ? "block"
                : "none";


        /*
            自由入力なら自由入力を表示
        */
        freeArea.style.display =
            templateMode
                ? "none"
                : "block";


        /*
            ボタンの色
        */
        templateLabel.classList.toggle(
            "active",
            templateMode
        );


        freeLabel.classList.toggle(
            "active",
            !templateMode
        );


        updatePreviewOnly();

    }


    /* =====================================================
       プレビュー更新
    ===================================================== */

    function updatePreviewOnly() {

        previewText.textContent =
            getAnnouncementText(
                data
            );

    }


    function updatePreview() {

        updatePreviewOnly();

        saveAnnouncements();

    }


    /* =====================================================
       定型文選択
    ===================================================== */

    templateRadio.addEventListener(
        "change",
        () => {

            if (
                templateRadio.checked
            ) {

                data.mode =
                    "template";


                updateModeDisplay();


                saveAnnouncements();

            }

        }
    );


    /* =====================================================
       自由入力選択
    ===================================================== */

    freeRadio.addEventListener(
        "change",
        () => {

            if (
                freeRadio.checked
            ) {

                data.mode =
                    "free";


                updateModeDisplay();


                saveAnnouncements();

            }

        }
    );


    /*
        初期表示
    */
    updateModeDisplay();


    return card;

}


/* =========================================================
   プルダウン作成
========================================================= */

function createSelectField(
    parent,
    labelText,
    options,
    currentValue,
    onChange
) {

    const field =
        document.createElement(
            "div"
        );


    field.className =
        "card-field";


    const label =
        document.createElement(
            "label"
        );


    label.textContent =
        labelText;


    const select =
        document.createElement(
            "select"
        );


    options.forEach(
        optionValue => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                optionValue;


            option.textContent =
                optionValue;


            if (
                optionValue ===
                currentValue
            ) {

                option.selected =
                    true;

            }


            select.appendChild(
                option
            );

        }
    );


    select.addEventListener(
        "change",
        () => {

            onChange(
                select.value
            );

        }
    );


    field.appendChild(
        label
    );


    field.appendChild(
        select
    );


    parent.appendChild(
        field
    );

}


/* =========================================================
   選択ボタン作成
========================================================= */

function createChoiceButton(
    parent,
    text,
    currentValue,
    onChange
) {

    const button =
        document.createElement(
            "button"
        );


    button.type =
        "button";


    button.className =
        "choice-button";


    if (
        text ===
        currentValue
    ) {

        button.classList.add(
            "active"
        );

    }


    button.textContent =
        text;


    button.addEventListener(
        "click",
        () => {


            /*
                同じグループのボタンを全部OFF
            */
            parent
                .querySelectorAll(
                    ".choice-button"
                )
                .forEach(
                    other => {

                        other.classList.remove(
                            "active"
                        );

                    }
                );


            /*
                押したボタンをON
            */
            button.classList.add(
                "active"
            );


            /*
                データを更新
            */
            onChange(
                text
            );

        }
    );


    parent.appendChild(
        button
    );

}


/* =========================================================
   放送設定追加
========================================================= */

addAnnouncementButton.addEventListener(

);


/* =========================================================
   Clock時刻変換
========================================================= */

function formatClockTime(
    seconds
) {

    const value =
        Math.floor(
            Number(
                seconds
            )
        );


    if (
        !Number.isFinite(
            value
        )
    ) {

        return "--:--:--";

    }


    /*
        24時間単位にする
    */
    const normalized =
        (
            (value % 86400) +
            86400
        ) % 86400;


    const hours =
        Math.floor(
            normalized / 3600
        );


    const minutes =
        Math.floor(
            (normalized % 3600) / 60
        );


    const secs =
        normalized % 60;


    return (

        String(
            hours
        ).padStart(2, "0")

        +

        ":"

        +

        String(
            minutes
        ).padStart(2, "0")

        +

        ":"

        +

        String(
            secs
        ).padStart(2, "0")

    );

}


/* =========================================================
   Clock表示更新
========================================================= */

function updateClock() {

    if (
        !roomData
    ) {

        return;

    }


    /*
        Clock_60XのvirtualSecondsを表示
    */
    clock.textContent =
        formatClockTime(
            roomData.virtualSeconds
        );


    /*
        Clock_60Xの動作状態
    */
    if (
        roomData.running
    ) {

        clockStatus.textContent =
            "Clock_60X運転中 ・ " +
            Number(
                roomData.speed || 1
            ) +
            "倍速";

    }
    else {

        clockStatus.textContent =
            "Clock_60X停止中";

    }

}


/* =========================================================
   部屋参加
========================================================= */

joinButton.addEventListener(
    "click",
    async () => {


        /*
            入力値取得
        */
        const inputRoomCode =
            roomCodeInput.value.trim();


        const password =
            roomPasswordInput.value;


        /* -------------------------------------------------
           部屋番号チェック
        ------------------------------------------------- */

        if (
            !/^\d{5}$/.test(
                inputRoomCode
            )
        ) {

            joinStatus.textContent =
                "部屋番号は5桁の数字で入力してください。";


            joinStatus.style.color =
                "#ff6b6b";


            return;

        }


        /* -------------------------------------------------
           パスワードチェック
        ------------------------------------------------- */

        if (
            password === ""
        ) {

            joinStatus.textContent =
                "パスワードを入力してください。";


            joinStatus.style.color =
                "#ff6b6b";


            return;

        }


        /* -------------------------------------------------
           接続中
        ------------------------------------------------- */

        joinButton.disabled =
            true;


        joinButton.textContent =
            "接続中...";


        joinStatus.textContent =
            "部屋を確認しています...";


        joinStatus.style.color =
            "#aaa";


        try {


            /* =============================================
               元のClock_60Xと同じ場所を見る
            ============================================= */

            const roomRef =
                doc(
                    db,
                    "rooms",
                    inputRoomCode
                );


            /*
                まず1回取得
            */
            const roomSnap =
                await getDoc(
                    roomRef
                );


            /* =============================================
               部屋が存在するか
            ============================================= */

            if (
                !roomSnap.exists()
            ) {

                joinStatus.textContent =
                    "部屋が存在しません。";


                joinStatus.style.color =
                    "#ff6b6b";


                return;

            }


            /*
                部屋データ
            */
            const data =
                roomSnap.data();


            /* =============================================
               パスワード確認
            ============================================= */

            if (
                data.password !==
                password
            ) {

                joinStatus.textContent =
                    "パスワードが違います。";


                joinStatus.style.color =
                    "#ff6b6b";


                return;

            }


            /* =============================================
               参加成功
            ============================================= */

            roomCode =
                inputRoomCode;


            roomData =
                data;


            /*
                表示
            */
            currentRoom.textContent =
                roomCode;


            /*
                参加画面を隠す
            */
            joinScreen.style.display =
                "none";


            /*
                アプリ画面を表示
            */
            appScreen.style.display =
                "block";


            /*
                接続状態を緑
            */
            connectionDot.classList.add(
                "online"
            );


            connectionStatus.textContent =
                "Clock_60Xと同期中";


            /*
                この部屋専用の設定を読み込む
            */
            loadAnnouncements();


            /*
                時計を最初に表示
            */
            updateClock();


            /* =============================================
               Clock_60Xをリアルタイム監視
            ============================================= */

            /*
                以前の監視があれば停止
            */
            if (
                unsubscribeRoom
            ) {

                unsubscribeRoom();

                unsubscribeRoom =
                    null;

            }


            /*
                Clock_60Xの元コードと同じく
                onSnapshotで部屋を監視する。
            */
            unsubscribeRoom =
                onSnapshot(

                    roomRef,

                    snapshot => {


                        /*
                            部屋が削除された場合
                        */
                        if (
                            !snapshot.exists()
                        ) {

                            connectionDot.classList.remove(
                                "online"
                            );


                            connectionStatus.textContent =
                                "部屋が削除されました";


                            return;

                        }


                        /*
                            最新データ
                        */
                        roomData =
                            snapshot.data();


                        /*
                            接続表示
                        */
                        connectionDot.classList.add(
                            "online"
                        );


                        connectionStatus.textContent =
                            "Clock_60Xと同期中";


                        /*
                            時計更新
                        */
                        updateClock();

                    },


                    /*
                        接続エラー
                    */
                    error => {

                        console.error(
                            "Firestore監視エラー:",
                            error
                        );


                        connectionDot.classList.remove(
                            "online"
                        );


                        connectionStatus.textContent =
                            "接続エラー";

                    }

                );


        }
        catch (error) {


            console.error(
                "部屋参加エラー:",
                error
            );


            joinStatus.textContent =
                "接続エラー\n\n" +
                error.message;


            joinStatus.style.color =
                "#ff6b6b";

        }
        finally {


            /*
                ボタンを元に戻す
            */
            joinButton.disabled =
                false;


            joinButton.textContent =
                "部屋に参加";

        }

    }
);


/* =========================================================
   Enterキーでも参加
========================================================= */

roomPasswordInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            joinButton.click();

        }

    }
);


/* =========================================================
   部屋から退出
========================================================= */

leaveButton.addEventListener(
    "click",
    () => {


        /*
            Firestore監視を停止
        */
        if (
            unsubscribeRoom
        ) {

            unsubscribeRoom();

            unsubscribeRoom =
                null;

        }


        /*
            状態をリセット
        */
        roomCode =
            null;


        roomData =
            null;


        announcements =
            [];


        /*
            画面を戻す
        */
        appScreen.style.display =
            "none";


        joinScreen.style.display =
            "block";


        /*
            入力欄をクリア
        */
        roomCodeInput.value =
            "";


        roomPasswordInput.value =
            "";


        /*
            接続表示リセット
        */
        connectionDot.classList.remove(
            "online"
        );


        connectionStatus.textContent =
            "接続中...";


        /*
            時計リセット
        */
        clock.textContent =
            "--:--:--";


        clockStatus.textContent =
            "Clock_60Xの時刻を取得中...";


        /*
            一覧リセット
        */
        renderAnnouncements();

    }
);


/* =========================================================
   初期化
========================================================= */

renderAnnouncements();

</script>

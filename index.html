<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clock-60Xplus-say</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   共通
========================= */

.hidden {
    display: none !important;
}

.container {
    width: min(100% - 30px, 900px);
    margin: 0 auto;
}

/* =========================
   ログイン画面
========================= */

#joinScreen {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.joinCard {
    width: 100%;
    max-width: 500px;

    background: #1d1d1d;
    border-radius: 20px;

    padding: 30px;

    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

.joinCard h1 {
    margin-top: 0;
    margin-bottom: 10px;

    text-align: center;

    font-size: 28px;
}

.joinDescription {
    color: #aaa;
    text-align: center;
    margin-bottom: 30px;
}

.inputGroup {
    margin-bottom: 20px;
}

.inputGroup label {
    display: block;

    margin-bottom: 8px;

    color: #ccc;
    font-size: 14px;
}

.inputGroup input {
    width: 100%;

    padding: 14px;

    border: none;
    border-radius: 10px;

    background: #292929;
    color: white;

    outline: none;
}

.inputGroup input:focus {
    background: #333;
}

#joinButton {
    width: 100%;

    padding: 15px;

    border: none;
    border-radius: 10px;

    background: #2455a6;
    color: white;

    font-weight: bold;
    font-size: 17px;
}

#joinButton:hover {
    background: #2e67c4;
}

#joinButton:disabled {
    opacity: 0.5;
    cursor: default;
}

#errorMessage {
    margin-top: 15px;

    color: #ff6b6b;

    text-align: center;
    font-size: 14px;
}

/* =========================
   メイン画面
========================= */

#mainScreen {
    min-height: 100vh;

    padding: 20px 0 50px;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.header h1 {
    margin: 0;

    font-size: 25px;
}

.roomInfo {
    color: #aaa;
    font-size: 14px;
}

/* =========================
   Clock同期状態
========================= */

.clockCard {
    background: #1d1d1d;

    border-radius: 20px;

    padding: 25px;

    margin-bottom: 20px;

    text-align: center;
}

.clockLabel {
    color: #999;

    font-size: 14px;

    margin-bottom: 8px;
}

#currentTime {
    font-size: clamp(50px, 12vw, 90px);

    font-weight: bold;

    font-variant-numeric: tabular-nums;
}

#syncStatus {
    margin-top: 10px;

    color: #6fcf97;

    font-size: 14px;
}

/* =========================
   設定カード
========================= */

.card {
    background: #1d1d1d;

    border-radius: 18px;

    padding: 20px;

    margin-bottom: 20px;
}

.card h2 {
    margin-top: 0;

    font-size: 20px;
}

/* =========================
   放送追加
========================= */

.addButton {
    width: 100%;

    padding: 15px;

    border: none;
    border-radius: 10px;

    background: #2455a6;
    color: white;

    font-weight: bold;
}

.addButton:hover {
    background: #2e67c4;
}

/* =========================
   放送カード
========================= */

.announcement {
    background: #292929;

    border-radius: 15px;

    padding: 18px;

    margin-top: 15px;
}

.announcementHeader {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin-bottom: 15px;
}

.announcementTitle {
    font-weight: bold;
}

.deleteButton {
    border: none;

    background: #713333;
    color: white;

    border-radius: 8px;

    padding: 8px 12px;
}

.deleteButton:hover {
    background: #914141;
}

.field {
    margin-bottom: 13px;
}

.field label {
    display: block;

    margin-bottom: 6px;

    color: #aaa;

    font-size: 13px;
}

.field select,
.field input {
    width: 100%;

    padding: 11px;

    border: none;
    border-radius: 9px;

    background: #1d1d1d;
    color: white;

    outline: none;
}

.timeRow {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;
}

/* =========================
   ON/OFF
========================= */

.enabledRow {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;
}

.switch {
    position: relative;

    width: 52px;
    height: 30px;
}

.switch input {
    opacity: 0;

    width: 0;
    height: 0;
}

.slider {
    position: absolute;

    inset: 0;

    background: #555;

    border-radius: 30px;

    transition: 0.2s;
}

.slider::before {
    content: "";

    position: absolute;

    width: 22px;
    height: 22px;

    left: 4px;
    top: 4px;

    background: white;

    border-radius: 50%;

    transition: 0.2s;
}

.switch input:checked + .slider {
    background: #2455a6;
}

.switch input:checked + .slider::before {
    transform: translateX(22px);
}

/* =========================
   モード
========================= */

.modeRow {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-bottom: 15px;
}

.modeButton {
    padding: 11px;

    border: 1px solid #444;

    border-radius: 9px;

    background: #222;
    color: #aaa;
}

.modeButton.active {
    background: #2455a6;
    border-color: #2455a6;

    color: white;
}

.freeText {
    display: none;
}

.freeText.active {
    display: block;
}

/* =========================
   状態表示
========================= */

.statusCard {
    background: #1d1d1d;

    border-radius: 18px;

    padding: 20px;

    margin-bottom: 20px;
}

#lastAnnouncement {
    color: #aaa;

    line-height: 1.6;
}

/* =========================
   レスポンシブ
========================= */

@media (max-width: 600px) {

    .joinCard {
        padding: 22px;
    }

    .timeRow {
        grid-template-columns: 1fr;
    }

    .header {
        flex-direction: column;

        align-items: flex-start;

        gap: 5px;
    }
}
</style>
</head>

<body>

<!-- ==========================================
     部屋参加画面
========================================== -->

<div id="joinScreen">

    <div class="joinCard">

        <h1>🚉 Clock-60Xplus-say</h1>

        <div class="joinDescription">
            Clock-60Xの部屋に接続して<br>
            発車・入庫放送を管理します
        </div>

        <div class="inputGroup">

            <label for="roomCode">
                部屋番号
            </label>

            <input
                id="roomCode"
                type="text"
                inputmode="numeric"
                maxlength="5"
                placeholder="5桁の部屋番号"
            >

        </div>

        <div class="inputGroup">

            <label for="roomPassword">
                パスワード
            </label>

            <input
                id="roomPassword"
                type="password"
                placeholder="パスワード"
            >

        </div>

        <button id="joinButton">
            部屋に入る
        </button>

        <div id="errorMessage"></div>

    </div>

</div>


<!-- ==========================================
     メイン画面
========================================== -->

<div id="mainScreen" class="hidden">

    <div class="container">

        <div class="header">

            <div>
                <h1>🚉 Clock-60Xplus-say</h1>

                <div class="roomInfo">
                    部屋番号：
                    <span id="displayRoomCode"></span>
                </div>
            </div>

        </div>


        <!-- 時計 -->

        <div class="clockCard">

            <div class="clockLabel">
                Clock-60X 現在時刻
            </div>

            <div id="currentTime">
                00:00:00
            </div>

            <div id="syncStatus">
                ● 接続中
            </div>

        </div>


        <!-- 放送設定 -->

        <div class="card">

            <h2>📢 放送設定</h2>

            <div id="announcementList"></div>

            <button
                id="addAnnouncementButton"
                class="addButton"
            >
                ＋ 放送を追加
            </button>

        </div>


        <!-- 状態 -->

        <div class="statusCard">

            <h2>📡 放送状態</h2>

            <div id="lastAnnouncement">
                まだ放送されていません。
            </div>

        </div>

    </div>

</div>


<!-- ==========================================
     Firebase
========================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


/* ==========================================
   Firebase設定

   Clock-60Xと同じFirebaseを使用
========================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyACeTgCIWyynzbHcbdPLfeK24nnOjEvOJk",

    authDomain:
        "clock-60x.firebaseapp.com",

    projectId:
        "clock-60x",

    storageBucket:
        "clock-60x.firebasestorage.app",

    messagingSenderId:
        "311438870758",

    appId:
        "1:311438870758:web:41d7ec11bad3c924965327",

    measurementId:
        "G-JXQN631WTB"
};


/* ==========================================
   Firebase初期化
========================================== */

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* ==========================================
   DOM
========================================== */

const joinScreen =
    document.getElementById("joinScreen");

const mainScreen =
    document.getElementById("mainScreen");

const roomCodeInput =
    document.getElementById("roomCode");

const roomPasswordInput =
    document.getElementById("roomPassword");

const joinButton =
    document.getElementById("joinButton");

const errorMessage =
    document.getElementById("errorMessage");

const displayRoomCode =
    document.getElementById("displayRoomCode");

const currentTime =
    document.getElementById("currentTime");

const syncStatus =
    document.getElementById("syncStatus");

const announcementList =
    document.getElementById("announcementList");

const addAnnouncementButton =
    document.getElementById("addAnnouncementButton");

const lastAnnouncement =
    document.getElementById("lastAnnouncement");


/* ==========================================
   状態
========================================== */

let roomCode = "";
let roomPassword = "";

let roomRef = null;

let unsubscribeRoom = null;

let virtualSeconds = 0;

let running = false;

let announcements = [];


/* ==========================================
   放送用選択肢
========================================== */

const stations = [
    "北春日部",
    "北越谷",
    "竹ノ塚"
];

const operations = [
    "L1",
    "L2",
    "L3",
    "TH",
    "E1",
    "E2",
    "E3",
    "E4",
    "E5",
    "E6",
    "S1",
    "S2",
    "S3",
    "LM1",
    "LM2",
    "LM3",
    "LM4",
    "LM5",
    "LM6",
    "EM1",
    "EM2"
];

const types = [
    "回送",
    "普通",
    "急行",
    "特急",
    "TH"
];

const timeTypes = [
    "発車時刻",
    "入庫時刻"
];

const instructions = [
    "列車を駅に待機させてください",
    "各駅員、列車の位置を共有してください"
];


/* ==========================================
   部屋ごとのlocalStorageキー
========================================== */

function getStorageKey() {

    return "Clock60XplusSay_" + roomCode;

}


/* ==========================================
   時刻表示
========================================== */

function formatTime(seconds) {

    seconds =
        Math.floor(seconds) % 86400;

    if (seconds < 0) {
        seconds += 86400;
    }

    const h =
        Math.floor(seconds / 3600);

    const m =
        Math.floor((seconds % 3600) / 60);

    const s =
        seconds % 60;

    return (
        String(h).padStart(2, "0")
        + ":"
        + String(m).padStart(2, "0")
        + ":"
        + String(s).padStart(2, "0")
    );
}


/* ==========================================
   放送設定を保存
========================================== */

function saveAnnouncements() {

    localStorage.setItem(
        getStorageKey(),
        JSON.stringify(announcements)
    );

}


/* ==========================================
   放送設定を読み込み
========================================== */

function loadAnnouncements() {

    const saved =
        localStorage.getItem(getStorageKey());

    if (!saved) {

        announcements = [];

        return;
    }

    try {

        const data =
            JSON.parse(saved);

        if (Array.isArray(data)) {

            announcements = data;

        } else {

            announcements = [];

        }

    } catch {

        announcements = [];

    }

}


/* ==========================================
   ID生成
========================================== */

function createId() {

    return (
        Date.now().toString(36)
        +
        Math.random()
            .toString(36)
            .substring(2)
    );

}


/* ==========================================
   <option>作成
========================================== */

function makeOptions(array, selected) {

    return array.map(value => {

        const isSelected =
            value === selected
                ? "selected"
                : "";

        return `
            <option
                value="${escapeHtml(value)}"
                ${isSelected}
            >
                ${escapeHtml(value)}
            </option>
        `;

    }).join("");

}


/* ==========================================
   HTMLエスケープ
========================================== */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* ==========================================
   放送文を作成
========================================== */

function makeTemplateText(item) {

    return (
        "まもなく、"
        + item.station
        + "車庫、"
        + item.operation
        + item.type
        + "、「"
        + item.time
        + "」です。「"
        + item.instruction
        + "」。"
    );

}


/* ==========================================
   放送一覧を描画
========================================== */

function renderAnnouncements() {

    announcementList.innerHTML = "";


    announcements.forEach((item, index) => {

        const card =
            document.createElement("div");

        card.className =
            "announcement";


        const header =
            document.createElement("div");

        header.className =
            "announcementHeader";


        header.innerHTML = `
            <div class="announcementTitle">
                放送 ${index + 1}
            </div>

            <button
                class="deleteButton"
                data-action="delete"
            >
                削除
            </button>
        `;


        card.appendChild(header);


        /* ON/OFF */

        const enabledRow =
            document.createElement("div");

        enabledRow.className =
            "enabledRow";

        enabledRow.innerHTML = `
            <span>この放送を有効にする</span>

            <label class="switch">

                <input
                    type="checkbox"
                    data-field="enabled"
                    ${item.enabled ? "checked" : ""}
                >

                <span class="slider"></span>

            </label>
        `;

        card.appendChild(enabledRow);


        /* モード */

        const modeRow =
            document.createElement("div");

        modeRow.className =
            "modeRow";


        const templateButton =
            document.createElement("button");

        templateButton.className =
            "modeButton "
            +
            (
                item.mode === "template"
                    ? "active"
                    : ""
            );

        templateButton.textContent =
            "定型文";

        templateButton.dataset.mode =
            "template";


        const freeButton =
            document.createElement("button");

        freeButton.className =
            "modeButton "
            +
            (
                item.mode === "free"
                    ? "active"
                    : ""
            );

        freeButton.textContent =
            "自由入力";

        freeButton.dataset.mode =
            "free";


        modeRow.appendChild(templateButton);
        modeRow.appendChild(freeButton);

        card.appendChild(modeRow);


        /* ==================================
           定型文
        ================================== */

        const templateArea =
            document.createElement("div");

        templateArea.className =
            item.mode === "template"
                ? ""
                : "hidden";


        templateArea.innerHTML = `

            <div class="field">

                <label>駅名</label>

                <select data-field="station">

                    ${makeOptions(
                        stations,
                        item.station
                    )}

                </select>

            </div>


            <div class="field">

                <label>運用番号</label>

                <select data-field="operation">

                    ${makeOptions(
                        operations,
                        item.operation
                    )}

                </select>

            </div>


            <div class="field">

                <label>種別</label>

                <select data-field="type">

                    ${makeOptions(
                        types,
                        item.type
                    )}

                </select>

            </div>


            <div class="timeRow">

                <div class="field">

                    <label>時刻</label>

                    <input
                        type="time"
                        step="1"
                        data-field="time"
                        value="${item.time}"
                    >

                </div>


                <div class="field">

                    <label>時刻の種類</label>

                    <select data-field="timeType">

                        ${makeOptions(
                            timeTypes,
                            item.timeType
                        )}

                    </select>

                </div>

            </div>


            <div class="field">

                <label>指示内容</label>

                <select data-field="instruction">

                    ${makeOptions(
                        instructions,
                        item.instruction
                    )}

                </select>

            </div>

        `;


        card.appendChild(templateArea);


        /* ==================================
           自由入力
        ================================== */

        const freeArea =
            document.createElement("div");

        freeArea.className =
            item.mode === "free"
                ? "freeText active"
                : "freeText";


        freeArea.innerHTML = `

            <div class="field">

                <label>自由入力</label>

                <input
                    type="text"
                    data-field="freeText"
                    value="${escapeHtml(
                        item.freeText || ""
                    )}"
                    placeholder="読み上げる文章"
                >

            </div>

        `;


        card.appendChild(freeArea);


        /* ==================================
           イベント
        ================================== */

        card.addEventListener(
            "change",
            event => {

                const field =
                    event.target.dataset.field;

                if (!field) return;


                if (
                    event.target.type ===
                    "checkbox"
                ) {

                    item[field] =
                        event.target.checked;

                } else {

                    item[field] =
                        event.target.value;

                }


                saveAnnouncements();

                updateLastPreview();

            }
        );


        templateButton.addEventListener(
            "click",
            () => {

                item.mode = "template";

                saveAnnouncements();

                renderAnnouncements();

            }
        );


        freeButton.addEventListener(
            "click",
            () => {

                item.mode = "free";

                saveAnnouncements();

                renderAnnouncements();

            }
        );


        header
            .querySelector("[data-action='delete']")
            .addEventListener(
                "click",
                () => {

                    announcements =
                        announcements.filter(
                            x => x.id !== item.id
                        );

                    saveAnnouncements();

                    renderAnnouncements();

                }
            );


        announcementList.appendChild(card);

    });


    updateLastPreview();

}


/* ==========================================
   放送追加
========================================== */

addAnnouncementButton.addEventListener(
    "click",
    () => {

        announcements.push({

            id: createId(),

            enabled: true,

            mode: "template",

            station: stations[0],

            operation: operations[0],

            type: types[0],

            time: "04:00:00",

            timeType: timeTypes[0],

            instruction: instructions[0],

            freeText: ""

        });


        saveAnnouncements();

        renderAnnouncements();

    }
);


/* ==========================================
   現在の設定を表示
========================================== */

function updateLastPreview() {

    const enabled =
        announcements.filter(
            item => item.enabled
        );

    if (enabled.length === 0) {

        lastAnnouncement.textContent =
            "有効な放送はありません。";

        return;
    }


    const item =
        enabled[0];


    let text;


    if (item.mode === "free") {

        text =
            item.freeText || "未入力";

    } else {

        text =
            makeTemplateText(item);

    }


    lastAnnouncement.textContent =
        "設定済みの放送："
        + text;

}


/* ==========================================
   Clock_60Xへ参加
========================================== */

joinButton.addEventListener(
    "click",
    async () => {

        errorMessage.textContent = "";

        const code =
            roomCodeInput.value.trim();

        const password =
            roomPasswordInput.value;


        /* 5桁チェック */

        if (!/^\d{5}$/.test(code)) {

            errorMessage.textContent =
                "部屋番号は5桁の数字で入力してください。";

            return;
        }


        if (!password) {

            errorMessage.textContent =
                "パスワードを入力してください。";

            return;
        }


        joinButton.disabled = true;

        joinButton.textContent =
            "接続中…";


        try {

            /*
             * Clock-60Xと同じ
             *
             * rooms/{部屋番号}
             */

            const ref =
                doc(
                    db,
                    "rooms",
                    code
                );


            const snapshot =
                await getDoc(ref);


            /* 部屋が存在しない */

            if (!snapshot.exists()) {

                throw new Error(
                    "部屋が存在しません。"
                );

            }


            const data =
                snapshot.data();


            /* パスワード確認 */

            if (
                data.password !== password
            ) {

                throw new Error(
                    "パスワードが違います。"
                );

            }


            /* ==================================
               ここまで来たら参加成功
            ================================== */

            roomCode = code;

            roomPassword = password;

            roomRef = ref;


            displayRoomCode.textContent =
                roomCode;


            /* 部屋ごとの設定を読み込む */

            loadAnnouncements();

            renderAnnouncements();


            /* 画面切り替え */

            joinScreen.classList.add(
                "hidden"
            );

            mainScreen.classList.remove(
                "hidden"
            );


            syncStatus.textContent =
                "● Clock-60Xに接続しました";


            /*
             * Firestoreリアルタイム監視
             */

            unsubscribeRoom =
                onSnapshot(
                    roomRef,
                    snapshot => {

                        if (!snapshot.exists()) {

                            syncStatus.textContent =
                                "● 部屋が削除されました";

                            return;

                        }


                        const data =
                            snapshot.data();


                        /*
                         * Clock-60Xの
                         * virtualSeconds
                         */

                        if (
                            typeof data.virtualSeconds
                            === "number"
                        ) {

                            virtualSeconds =
                                data.virtualSeconds;

                            currentTime.textContent =
                                formatTime(
                                    virtualSeconds
                                );

                        }


                        /*
                         * Clock-60Xのrunning
                         */

                        if (
                            typeof data.running
                            === "boolean"
                        ) {

                            running =
                                data.running;

                        }


                        syncStatus.textContent =
                            running
                                ? "● 同期中・時計動作中"
                                : "● 同期中・時計停止中";

                    },

                    error => {

                        console.error(
                            error
                        );

                        syncStatus.textContent =
                            "● 同期エラー";

                    }
                );


        } catch (error) {

            console.error(error);

            errorMessage.textContent =
                error.message
                ||
                "部屋への接続に失敗しました。";

        } finally {

            joinButton.disabled = false;

            joinButton.textContent =
                "部屋に入る";

        }

    }
);


/* ==========================================
   Enterキーで参加
========================================== */

roomPasswordInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            joinButton.click();

        }

    }
);


/* ==========================================
   部屋番号を数字だけにする
========================================== */

roomCodeInput.addEventListener(
    "input",
    () => {

        roomCodeInput.value =
            roomCodeInput.value
                .replace(/\D/g, "")
                .slice(0, 5);

    }
);


/* ==========================================
   初期表示
========================================== */

currentTime.textContent =
    "00:00:00";

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock_60X 放送設定</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial, "Noto Sans JP", sans-serif;
}

button,
input,
textarea {
    font: inherit;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    color: #fff;
    background: #18548a;
    cursor: pointer;
}

button:hover {
    background: #226ba9;
}

button:disabled {
    opacity: 0.5;
    cursor: default;
}

input,
textarea {
    width: 100%;
    padding: 12px;
    background: #292929;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #438bd0;
}

textarea {
    min-height: 100px;
    resize: vertical;
    line-height: 1.6;
}


/* =================================
   ヘッダー
================================= */

header {
    padding: 18px;
    text-align: center;
    background: #181818;
    border-bottom: 1px solid #333;
}

header h1 {
    margin: 0;
    font-size: 27px;
}


/* =================================
   コンテナ
================================= */

.container {
    max-width: 950px;
    margin: auto;
    padding: 20px;
}


/* =================================
   部屋参加画面
================================= */

#joinScreen {
    max-width: 520px;
    margin: 60px auto;
}

.join-title {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 25px;
}

.join-box {
    background: #1d1d1d;
    border-radius: 15px;
    padding: 25px;
}

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    color: #bbb;
}

#joinButton {
    width: 100%;
    padding: 15px;
    font-size: 19px;
}

#joinStatus {
    min-height: 24px;
    margin-top: 15px;
    padding: 10px;
    background: #111;
    border-radius: 8px;
    white-space: pre-wrap;
}


/* =================================
   アプリ画面
================================= */

#appScreen {
    display: none;
}


/* =================================
   接続情報
================================= */

.connection {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;

    margin-bottom: 18px;
    padding: 14px 16px;

    background: #1d1d1d;
    border-radius: 12px;
}

.connection-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.connection-dot {
    width: 12px;
    height: 12px;
    flex-shrink: 0;

    background: #777;
    border-radius: 50%;
}

.connection-dot.online {
    background: #39c172;
    box-shadow: 0 0 8px rgba(57, 193, 114, 0.7);
}

.room-number {
    font-size: 18px;
    font-weight: bold;
}

.connection-status {
    margin-top: 3px;
    color: #aaa;
    font-size: 14px;
}

.leave-button {
    background: #682929;
}

.leave-button:hover {
    background: #893636;
}


/* =================================
   時計
================================= */

.clock-panel {
    margin-bottom: 18px;
    padding: 25px;

    background: #181818;
    border-radius: 15px;

    text-align: center;
}

.clock {
    font-size: clamp(52px, 11vw, 100px);
    font-weight: bold;
    letter-spacing: 4px;
    line-height: 1;
}

.clock-status {
    margin-top: 14px;
    color: #aaa;
    font-size: 18px;
}


/* =================================
   放送設定パネル
================================= */

.panel {
    margin-bottom: 18px;
    padding: 22px;

    background: #1d1d1d;
    border-radius: 15px;
}

.panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;

    margin-bottom: 18px;
}

.panel-title h2 {
    margin: 0;
    font-size: 23px;
}

.add-button {
    background: #28613c;
}

.add-button:hover {
    background: #347a4b;
}


/* =================================
   設定一覧
================================= */

.announcement-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}


/* =================================
   1件の設定
================================= */

.announcement-card {
    padding: 18px;

    background: #292929;
    border: 1px solid #3b3b3b;
    border-radius: 14px;
}

.announcement-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    margin-bottom: 18px;
}

.announcement-number {
    font-size: 19px;
    font-weight: bold;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}


/* =================================
   ON/OFF
================================= */

.switch {
    display: flex;
    align-items: center;
    gap: 7px;

    color: #ccc;
    cursor: pointer;
}

.switch input {
    width: 20px;
    height: 20px;
    cursor: pointer;
}


/* =================================
   時刻
================================= */

.setting-label {
    margin-bottom: 7px;
    color: #aaa;
    font-size: 14px;
}

.time-input {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
    text-align: center;
}


/* =================================
   コメント
================================= */

.comment-area {
    margin-top: 16px;
}

.comment-textarea {
    font-size: 16px;
}


/* =================================
   削除
================================= */

.delete-button {
    background: #682929;
}

.delete-button:hover {
    background: #893636;
}


/* =================================
   プレビュー
================================= */

.preview {
    margin-top: 16px;
    padding: 14px;

    background: #111;
    border: 1px solid #383838;
    border-radius: 10px;
}

.preview-label {
    margin-bottom: 7px;
    color: #777;
    font-size: 13px;
}

.preview-text {
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
}


/* =================================
   保存表示
================================= */

.save-status {
    min-height: 20px;
    margin-top: 10px;
    color: #67cf91;
}


/* =================================
   設定がない場合
================================= */

.empty-message {
    padding: 25px;

    background: #111;
    border-radius: 10px;

    color: #777;
    text-align: center;
    line-height: 1.7;
}


/* =================================
   スマホ
================================= */

@media (max-width: 700px) {

    .connection {
        flex-direction: column;
        align-items: stretch;
    }

    .leave-button {
        width: 100%;
    }

    .panel-title {
        flex-direction: column;
        align-items: stretch;
    }

    .add-button {
        width: 100%;
    }

    .announcement-header {
        align-items: flex-start;
    }

    .header-right {
        flex-wrap: wrap;
        justify-content: flex-end;
    }

}
</style>
</head>


<body>


<header>
    <h1>Clock_60X 放送設定</h1>
</header>


<!-- =================================
     部屋参加
================================= -->

<div id="joinScreen" class="container">

    <div class="join-title">
        部屋に参加
    </div>

    <div class="join-box">

        <div class="field">

            <label for="roomCode">
                5桁の部屋番号
            </label>

            <input
                id="roomCode"
                type="text"
                inputmode="numeric"
                maxlength="5"
                placeholder="例：42540"
                autocomplete="off"
            >

        </div>


        <div class="field">

            <label for="roomPassword">
                パスワード
            </label>

            <input
                id="roomPassword"
                type="password"
                placeholder="パスワード"
                autocomplete="off"
            >

        </div>


        <button id="joinButton">
            部屋に参加
        </button>


        <div id="joinStatus"></div>

    </div>

</div>


<!-- =================================
     アプリ
================================= -->

<div id="appScreen" class="container">


    <!-- 接続情報 -->

    <div class="connection">

        <div class="connection-left">

            <div
                id="connectionDot"
                class="connection-dot"
            ></div>

            <div>

                <div class="room-number">
                    部屋 <span id="currentRoom">-----</span>
                </div>

                <div
                    id="connectionStatus"
                    class="connection-status"
                >
                    接続中...
                </div>

            </div>

        </div>


        <button
            id="leaveButton"
            class="leave-button"
        >
            部屋から退出
        </button>

    </div>



    <!-- 時計 -->

    <div class="clock-panel">

        <div
            id="clock"
            class="clock"
        >
            --:--:--
        </div>

        <div
            id="clockStatus"
            class="clock-status"
        >
            Clock_60Xの時刻を取得中...
        </div>

    </div>



    <!-- 放送設定 -->

    <div class="panel">

        <div class="panel-title">

            <h2>
                放送設定
            </h2>

            <button
                id="addAnnouncementButton"
                class="add-button"
            >
                ＋ 放送設定を追加
            </button>

        </div>


        <div
            id="announcementList"
            class="announcement-list"
        ></div>


        <div
            id="saveStatus"
            class="save-status"
        ></div>

    </div>

</div>



<script type="module">


/* =========================================
   Firebase
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyACeTgCIWyynzbHcbdPLfeK24nnOjEvOJk",

    authDomain:
        "clock-60x.firebaseapp.com",

    projectId:
        "clock-60x",

    storageBucket:
        "clock-60x.firebasestorage.app",

    messagingSenderId:
        "311438870758",

    appId:
        "1:311438870758:web:41d7ec11bad3c924965327",

    measurementId:
        "G-JXQN631WTB"

};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(
        app
    );


/* =========================================
   DOM
========================================= */

const joinScreen =
    document.getElementById(
        "joinScreen"
    );

const appScreen =
    document.getElementById(
        "appScreen"
    );

const roomCodeInput =
    document.getElementById(
        "roomCode"
    );

const roomPasswordInput =
    document.getElementById(
        "roomPassword"
    );

const joinButton =
    document.getElementById(
        "joinButton"
    );

const joinStatus =
    document.getElementById(
        "joinStatus"
    );

const currentRoom =
    document.getElementById(
        "currentRoom"
    );

const connectionDot =
    document.getElementById(
        "connectionDot"
    );

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const leaveButton =
    document.getElementById(
        "leaveButton"
    );

const clock =
    document.getElementById(
        "clock"
    );

const clockStatus =
    document.getElementById(
        "clockStatus"
    );

const announcementList =
    document.getElementById(
        "announcementList"
    );

const addAnnouncementButton =
    document.getElementById(
        "addAnnouncementButton"
    );

const saveStatus =
    document.getElementById(
        "saveStatus"
    );


/* =========================================
   状態
========================================= */

let joinedRoomCode = null;

let roomData = null;

let unsubscribeRoom = null;

let announcements = [];


/* =========================================
   部屋ごとの保存キー
========================================= */

function getStorageKey() {

    return (
        "clock60x-say-" +
        joinedRoomCode
    );

}


/* =========================================
   新規設定
========================================= */

function createAnnouncement() {

    return {

        id:
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2),

        enabled:
            true,

        time:
            "05:00:00",

        comment:
            ""

    };

}


/* =========================================
   保存
========================================= */

function saveSettings() {

    if (!joinedRoomCode) {
        return;
    }


    localStorage.setItem(
        getStorageKey(),
        JSON.stringify(
            announcements
        )
    );


    saveStatus.textContent =
        "設定を保存しました";


    clearTimeout(
        saveSettings.timer
    );


    saveSettings.timer =
        setTimeout(
            () => {

                saveStatus.textContent =
                    "";

            },
            1200
        );

}


/* =========================================
   読み込み
========================================= */

function loadSettings() {

    const raw =
        localStorage.getItem(
            getStorageKey()
        );


    if (!raw) {

        announcements = [];

        renderAnnouncements();

        return;

    }


    try {

        const data =
            JSON.parse(
                raw
            );


        if (
            Array.isArray(data)
        ) {

            announcements =
                data.map(
                    item => ({

                        id:
                            item.id ||
                            (
                                Date.now() +
                                "-" +
                                Math.random()
                            ),

                        enabled:
                            item.enabled !== false,

                        time:
                            item.time ||
                            "05:00:00",

                        comment:
                            item.comment ||
                            ""

                    })
                );

        }
        else {

            announcements = [];

        }

    }
    catch (error) {

        console.error(
            "設定読み込みエラー:",
            error
        );

        announcements = [];

    }


    renderAnnouncements();

}


/* =========================================
   時刻をHH:MM:SSに揃える
========================================= */

function normalizeTime(time) {

    if (
        typeof time !== "string"
    ) {

        return "05:00:00";

    }


    const parts =
        time.split(":");


    if (
        parts.length === 2
    ) {

        return time + ":00";

    }


    if (
        parts.length === 3
    ) {

        return time;

    }


    return "05:00:00";

}


/* =========================================
   放送設定一覧描画
========================================= */

function renderAnnouncements() {

    announcementList.innerHTML =
        "";


    if (
        announcements.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "empty-message";

        empty.textContent =
            "まだ放送設定がありません。" +
            "「＋ 放送設定を追加」から追加してください。";

        announcementList.appendChild(
            empty
        );

        return;

    }


    announcements.forEach(
        (announcement, index) => {

            const card =
                createAnnouncementCard(
                    announcement,
                    index
                );

            announcementList.appendChild(
                card
            );

        }
    );

}


/* =========================================
   1件の設定カード
========================================= */

function createAnnouncementCard(
    data,
    index
) {

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "announcement-card";


    /* -------------------------
       ヘッダー
    ------------------------- */

    const header =
        document.createElement(
            "div"
        );

    header.className =
        "announcement-header";


    const title =
        document.createElement(
            "div"
        );

    title.className =
        "announcement-number";

    title.textContent =
        "放送設定 " +
        (index + 1);


    const headerRight =
        document.createElement(
            "div"
        );

    headerRight.className =
        "header-right";


    /* ON/OFF */

    const switchLabel =
        document.createElement(
            "label"
        );

    switchLabel.className =
        "switch";


    const checkbox =
        document.createElement(
            "input"
        );

    checkbox.type =
        "checkbox";

    checkbox.checked =
        data.enabled;


    const switchText =
        document.createElement(
            "span"
        );

    switchText.textContent =
        "ON";


    checkbox.addEventListener(
        "change",
        () => {

            data.enabled =
                checkbox.checked;

            switchText.textContent =
                checkbox.checked
                    ? "ON"
                    : "OFF";

            saveSettings();

        }
    );


    switchText.textContent =
        data.enabled
            ? "ON"
            : "OFF";


    switchLabel.appendChild(
        checkbox
    );

    switchLabel.appendChild(
        switchText
    );


    /* 削除 */

    const deleteButton =
        document.createElement(
            "button"
        );

    deleteButton.className =
        "delete-button";

    deleteButton.textContent =
        "削除";


    deleteButton.addEventListener(
        "click",
        () => {

            const confirmed =
                confirm(
                    "この放送設定を削除しますか？"
                );


            if (!confirmed) {
                return;
            }


            announcements =
                announcements.filter(
                    item =>
                        item.id !==
                        data.id
                );


            saveSettings();

            renderAnnouncements();

        }
    );


    headerRight.appendChild(
        switchLabel
    );

    headerRight.appendChild(
        deleteButton
    );


    header.appendChild(
        title
    );

    header.appendChild(
        headerRight
    );


    card.appendChild(
        header
    );


    /* -------------------------
       通知時刻
    ------------------------- */

    const timeLabel =
        document.createElement(
            "div"
        );

    timeLabel.className =
        "setting-label";

    timeLabel.textContent =
        "通知時刻";


    const timeInput =
        document.createElement(
            "input"
        );

    timeInput.type =
        "time";

    timeInput.step =
        "1";

    timeInput.className =
        "time-input";

    timeInput.value =
        normalizeTime(
            data.time
        );


    timeInput.addEventListener(
        "change",
        () => {

            data.time =
                normalizeTime(
                    timeInput.value
                );

            saveSettings();

        }
    );


    card.appendChild(
        timeLabel
    );

    card.appendChild(
        timeInput
    );


    /* -------------------------
       コメント
    ------------------------- */

    const commentArea =
        document.createElement(
            "div"
        );

    commentArea.className =
        "comment-area";


    const commentLabel =
        document.createElement(
            "div"
        );

    commentLabel.className =
        "setting-label";

    commentLabel.textContent =
        "コメント";


    const commentInput =
        document.createElement(
            "textarea"
        );

    commentInput.className =
        "comment-textarea";

    commentInput.placeholder =
        "ここに、この時刻に読み上げる文章を入力";


    commentInput.value =
        data.comment;


    commentInput.addEventListener(
        "input",
        () => {

            data.comment =
                commentInput.value;

            preview.textContent =
                data.comment ||
                "コメントがまだ入力されていません。";

            saveSettings();

        }
    );


    commentArea.appendChild(
        commentLabel
    );

    commentArea.appendChild(
        commentInput
    );


    card.appendChild(
        commentArea
    );


    /* -------------------------
       プレビュー
    ------------------------- */

    const previewBox =
        document.createElement(
            "div"
        );

    previewBox.className =
        "preview";


    const previewLabel =
        document.createElement(
            "div"
        );

    previewLabel.className =
        "preview-label";

    previewLabel.textContent =
        "読み上げ内容";


    const preview =
        document.createElement(
            "div"
        );

    preview.className =
        "preview-text";

    preview.textContent =
        data.comment ||
        "コメントがまだ入力されていません。";


    previewBox.appendChild(
        previewLabel
    );

    previewBox.appendChild(
        preview
    );


    card.appendChild(
        previewBox
    );


    return card;

}


/* =========================================
   放送設定追加
========================================= */

addAnnouncementButton.addEventListener(
    "click",
    () => {

        const newAnnouncement =
            createAnnouncement();


        announcements.push(
            newAnnouncement
        );


        saveSettings();

        renderAnnouncements();


        setTimeout(
            () => {

                const cards =
                    document.querySelectorAll(
                        ".announcement-card"
                    );


                const lastCard =
                    cards[
                        cards.length - 1
                    ];


                if (lastCard) {

                    lastCard.scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });


                    const textarea =
                        lastCard.querySelector(
                            "textarea"
                        );


                    if (textarea) {

                        textarea.focus();

                    }

                }

            },
            100
        );

    }
);


/* =========================================
   Clock 時刻表示
========================================= */

function formatTime(seconds) {

    seconds =
        Math.floor(
            Number(
                seconds
            )
        );


    if (
        !Number.isFinite(
            seconds
        )
    ) {

        return "--:--:--";

    }


    seconds =
        (
            (seconds % 86400) +
            86400
        ) % 86400;


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        seconds % 60;


    return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );

}


/* =========================================
   Clock更新
========================================= */

function updateClock() {

    if (!roomData) {
        return;
    }


    const seconds =
        Number(
            roomData.virtualSeconds
        );


    clock.textContent =
        formatTime(
            seconds
        );


    const running =
        Boolean(
            roomData.running
        );


    const speed =
        Number(
            roomData.speed || 1
        );


    clockStatus.textContent =
        running
            ? "Clock_60X運転中 ・ " +
              speed +
              "倍速"
            : "Clock_60X停止中";

}


/* =========================================
   部屋参加
========================================= */

joinButton.addEventListener(
    "click",
    async () => {

        const roomCode =
            roomCodeInput.value.trim();

        const password =
            roomPasswordInput.value;


        if (
            !/^\d{5}$/.test(
                roomCode
            )
        ) {

            joinStatus.textContent =
                "部屋番号は5桁の数字で入力してください。";

            joinStatus.style.color =
                "#ff6b6b";

            return;

        }


        if (
            password.trim() === ""
        ) {

            joinStatus.textContent =
                "パスワードを入力してください。";

            joinStatus.style.color =
                "#ff6b6b";

            return;

        }


        joinButton.disabled =
            true;

        joinButton.textContent =
            "接続中...";


        joinStatus.textContent =
            "部屋を確認しています...";

        joinStatus.style.color =
            "#aaa";


        try {

            const roomRef =
                doc(
                    db,
                    "rooms",
                    roomCode
                );


            const snapshot =
                await getDoc(
                    roomRef
                );


            if (
                !snapshot.exists()
            ) {

                joinStatus.textContent =
                    "その部屋は存在しません。";

                joinStatus.style.color =
                    "#ff6b6b";

                return;

            }


            const data =
                snapshot.data();


            if (
                data.password !==
                password
            ) {

                joinStatus.textContent =
                    "パスワードが違います。";

                joinStatus.style.color =
                    "#ff6b6b";

                return;

            }


            /* -------------------------
               参加成功
            ------------------------- */

            joinedRoomCode =
                roomCode;

            roomData =
                data;


            currentRoom.textContent =
                roomCode;


            joinScreen.style.display =
                "none";

            appScreen.style.display =
                "block";


            connectionDot.classList.add(
                "online"
            );


            connectionStatus.textContent =
                "Clock_60Xと同期中";


            loadSettings();


            if (
                unsubscribeRoom
            ) {

                unsubscribeRoom();

            }


            unsubscribeRoom =
                onSnapshot(

                    roomRef,

                    snapshot => {

                        if (
                            !snapshot.exists()
                        ) {

                            connectionDot.classList.remove(
                                "online"
                            );

                            connectionStatus.textContent =
                                "部屋が削除されました";

                            return;

                        }


                        roomData =
                            snapshot.data();


                        updateClock();

                    },

                    error => {

                        console.error(
                            "Firestore監視エラー:",
                            error
                        );


                        connectionDot.classList.remove(
                            "online"
                        );


                        connectionStatus.textContent =
                            "接続エラー";

                    }

                );


            updateClock();

        }
        catch (error) {

            console.error(
                "部屋参加エラー:",
                error
            );


            joinStatus.textContent =
                "接続エラー\n\n" +
                error.message;

            joinStatus.style.color =
                "#ff6b6b";

        }
        finally {

            joinButton.disabled =
                false;

            joinButton.textContent =
                "部屋に参加";

        }

    }
);


/* =========================================
   Enter
========================================= */

roomPasswordInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            joinButton.click();

        }

    }
);


/* =========================================
   部屋退出
========================================= */

leaveButton.addEventListener(
    "click",
    () => {

        if (
            unsubscribeRoom
        ) {

            unsubscribeRoom();

            unsubscribeRoom =
                null;

        }


        joinedRoomCode =
            null;

        roomData =
            null;

        announcements =
            [];


        appScreen.style.display =
            "none";

        joinScreen.style.display =
            "block";


        roomCodeInput.value =
            "";

        roomPasswordInput.value =
            "";


        connectionDot.classList.remove(
            "online"
        );


        clock.textContent =
            "--:--:--";


        clockStatus.textContent =
            "Clock_60Xの時刻を取得中...";


        connectionStatus.textContent =
            "接続中...";


        renderAnnouncements();

    }
);


/* =========================================
   初期化
========================================= */

renderAnnouncements();

</script>

</body>
</html>

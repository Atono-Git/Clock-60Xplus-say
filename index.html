```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock_60X 放送テスト</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    padding: 30px;
}

.box {
    max-width: 500px;
    margin: auto;
    background: #1d1d1d;
    padding: 25px;
    border-radius: 15px;
}

input {
    width: 100%;
    box-sizing: border-box;
    margin-top: 8px;
    margin-bottom: 15px;
    padding: 14px;
    font-size: 18px;
    background: #292929;
    color: white;
    border: 1px solid #555;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    background: #164a7b;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

#status {
    margin-top: 20px;
    padding: 15px;
    background: #111;
    border-radius: 8px;
    white-space: pre-wrap;
}

.success {
    color: #63d297;
}

.error {
    color: #ff6b6b;
}
</style>
</head>

<body>

<div class="box">

    <h1>Clock_60X 放送アプリ</h1>

    <label>5桁の部屋番号</label>
    <input
        id="roomCode"
        type="text"
        inputmode="numeric"
        maxlength="5"
        placeholder="12345"
    >

    <label>パスワード</label>
    <input
        id="roomPassword"
        type="password"
        placeholder="パスワード"
    >

    <button id="joinButton">
        部屋に参加
    </button>

    <div id="status">
        待機中
    </div>

</div>


<script type="module">

/* =========================================
   まずJavaScriptが動いているか確認
========================================= */

const status =
    document.getElementById("status");

status.textContent =
    "JavaScript読み込み成功";


console.log(
    "[Clock_60X Announcer] JavaScript OK"
);


/* =========================================
   Firebase
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyACeTgCIWyynzbHcbdPLfeK24nnOjEvOJk",

    authDomain:
        "clock-60x.firebaseapp.com",

    projectId:
        "clock-60x",

    storageBucket:
        "clock-60x.firebasestorage.app",

    messagingSenderId:
        "311438870758",

    appId:
        "1:311438870758:web:41d7ec11bad3c924965327",

    measurementId:
        "G-JXQN631WTB"

};


let db;

try {

    const app =
        initializeApp(
            firebaseConfig
        );

    db =
        getFirestore(
            app
        );

    status.textContent =
        "Firebase接続準備OK";

    status.className =
        "success";

    console.log(
        "[Clock_60X Announcer] Firebase OK"
    );

}
catch (error) {

    status.textContent =
        "Firebase初期化エラー\n\n" +
        error.message;

    status.className =
        "error";

    console.error(
        error
    );

}


/* =========================================
   部屋参加
========================================= */

document
    .getElementById("joinButton")
    .addEventListener(
        "click",
        async () => {

            console.log(
                "[Clock_60X Announcer] ボタン押下"
            );


            const roomCode =
                document
                    .getElementById(
                        "roomCode"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "roomPassword"
                    )
                    .value;


            status.className = "";


            if (
                !/^\d{5}$/.test(
                    roomCode
                )
            ) {

                status.textContent =
                    "部屋番号は5桁の数字で入力してください。";

                status.className =
                    "error";

                return;

            }


            if (
                password === ""
            ) {

                status.textContent =
                    "パスワードを入力してください。";

                status.className =
                    "error";

                return;

            }


            if (!db) {

                status.textContent =
                    "Firebaseが初期化されていません。";

                status.className =
                    "error";

                return;

            }


            status.textContent =
                "部屋を検索中...";


            try {

                const roomRef =
                    doc(
                        db,
                        "rooms",
                        roomCode
                    );


                console.log(
                    "検索:",
                    "rooms/" + roomCode
                );


                const snapshot =
                    await getDoc(
                        roomRef
                    );


                console.log(
                    "snapshot:",
                    snapshot
                );


                if (
                    !snapshot.exists()
                ) {

                    status.textContent =
                        "部屋が存在しません。";

                    status.className =
                        "error";

                    return;

                }


                const data =
                    snapshot.data();


                console.log(
                    "部屋データ:",
                    data
                );


                if (
                    data.password !==
                    password
                ) {

                    status.textContent =
                        "パスワードが違います。";

                    status.className =
                        "error";

                    return;

                }


                status.textContent =
                    "部屋への参加に成功しました！\n\n" +
                    "部屋番号: " +
                    roomCode;

                status.className =
                    "success";


            }
            catch (error) {

                console.error(
                    "Firestoreエラー:",
                    error
                );


                status.textContent =
                    "エラーが発生しました。\n\n" +
                    "code: " +
                    (error.code || "なし") +
                    "\n\n" +
                    error.message;

                status.className =
                    "error";

            }

        }
    );

</script>

</body>
</html>

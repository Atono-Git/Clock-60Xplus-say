<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock_60X 放送設定</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial, "Noto Sans JP", sans-serif;
}

button,
input,
textarea,
select {

}

button {
    border: 0;

}

button:hover {

button:disabled {

input,
textarea,

}

textarea:focus,
select:focus {

textarea {
    min-height: 110px;

header {

header h1 {

}

.container {

    margin: 0 auto;

/* =========================
   部屋参加
========================= */

#joinScreen {
    max-width: 520px;

}

.join-title {
    text-align: center;
    font-size: 30px;

}

.join-box {

}

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;

}

#joinButton {

}

#joinStatus {
    margin-top: 15px;
    min-height: 24px;
    padding: 10px;
    background: #111;
    border-radius: 8px;
    white-space: pre-wrap;
}

/* =========================
   アプリ
========================= */

#appScreen {
    display: none;
}

/* =========================
   接続
========================= */

.connection {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    padding: 14px 16px;

    border-radius: 12px;
}

.connection-left {
    display: flex;
    align-items: center;

}

.connection-dot {

}

.connection-dot.online {

}

.room-number {

}

.connection-status {

}

.leave-button {

}

}

/* =========================
   時計
========================= */

.clock-panel {
    margin-bottom: 18px;

    background: #181818;
    border-radius: 15px;

}

.clock {
    font-size: clamp(52px, 11vw, 100px);

}

.clock-status {
    margin-top: 14px;

/* =========================
   放送設定
========================= */

.panel {
    margin-bottom: 18px;
    padding: 22px;
    background: #1d1d1d;
    border-radius: 15px;
}

.panel-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
}

.panel-title h2 {

}

.add-button {

}

.add-button:hover {
    background: #347a4b;
}

.announcement-list {

    flex-direction: column;

}

/* =========================
   放送設定カード
========================= */

.announcement-card {
    padding: 18px;
    background: #292929;
    border: 1px solid #3b3b3b;
    border-radius: 14px;
}

.announcement-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
}

.announcement-number {
    font-size: 19px;
    font-weight: bold;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.switch {
    display: flex;
    align-items: center;
    gap: 7px;
    color: #ccc;
    cursor: pointer;
}

.switch input {
    width: 20px;
    height: 20px;
}

.delete-button {
    background: #682929;
}

.delete-button:hover {
    background: #893636;
}

.setting-label {
    margin-bottom: 7px;
    color: #aaa;
    font-size: 14px;
}

/* =========================
   時刻
========================= */

.time-area {
    margin-bottom: 18px;
}

.time-input {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
    text-align: center;
}

/* =========================
   コメント方式
========================= */

.mode-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
}

.mode-button {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    background: #181818;
    border: 1px solid #444;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
}

.mode-button.active {
    background: #18548a;
    border-color: #438bd0;
}

.mode-button input {
    display: none;
}

/* =========================
   定型文
========================= */

.template-area {
    padding: 16px;
    background: #222;
    border-radius: 10px;
}

.template-fields {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.card-field {
    margin-bottom: 14px;
}

.card-field label {
    display: block;
    margin-bottom: 6px;
    color: #aaa;
    font-size: 14px;
}

.choice-area {
    margin-top: 10px;
}

.choice-title {
    margin-bottom: 8px;
    color: #aaa;
    font-size: 14px;
}

.choice-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 15px;
}

.choice-button {
    padding: 10px 13px;
    background: #181818;
    border: 1px solid #444;
    border-radius: 9px;
}

.choice-button:hover {
    background: #303030;
}

.choice-button.active {
    background: #18548a;
    border-color: #438bd0;
}

/* =========================
   自由入力
========================= */

.free-comment {
    margin-top: 5px;
}

/* =========================
   プレビュー
========================= */

.preview {
    margin-top: 16px;
    padding: 14px;
    background: #111;
    border: 1px solid #383838;
    border-radius: 10px;
}

.preview-label {
    margin-bottom: 7px;
    color: #777;
    font-size: 13px;
}

.preview-text {
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
}

/* =========================
   保存表示
========================= */

.save-status {
    min-height: 20px;
    margin-top: 10px;
    color: #67cf91;
}

/* =========================
   空
========================= */

.empty-message {
    padding: 25px;
    background: #111;
    border-radius: 10px;
    color: #777;
    text-align: center;
    line-height: 1.7;
}

/* =========================
   スマホ
========================= */

@media (max-width: 700px) {

    .connection {
        flex-direction: column;
        align-items: stretch;
    }

    .leave-button {
        width: 100%;
    }

    .panel-title {
        flex-direction: column;
        align-items: stretch;
    }

    .add-button {
        width: 100%;
    }

    .announcement-header {
        align-items: flex-start;
    }

    .header-right {
        flex-wrap: wrap;
        justify-content: flex-end;
    }

    .template-fields {
        grid-template-columns: 1fr;
    }
}
</style>
</head>


<body>


<header>
    <h1>Clock_60X 放送設定</h1>
</header>


<!-- =================================
     部屋参加画面
================================= -->

<div id="joinScreen" class="container">

    <div class="join-title">
        部屋に参加
    </div>

    <div class="join-box">

        <div class="field">

            <label for="roomCode">

            </label>

                type="password"

        </div>


        <button id="joinButton">
            部屋に参加
        </button>


        <div id="joinStatus"></div>

    </div>

</div>



<!-- =================================
     アプリ本体
================================= -->

<div id="appScreen" class="container">


    <!-- 接続情報 -->

    <div class="connection">

        <div class="connection-left">

            <div
                id="connectionDot"
                class="connection-dot"
            ></div>

            <div>

                <div class="room-number">
                    部屋 <span id="currentRoom">-----</span>

</div>



<script type="module">


/* =========================================
   Firebase
========================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyACeTgCIWyynzbHcbdPLfeK24nnOjEvOJk",
    authDomain: "clock-60x.firebaseapp.com",
    projectId: "clock-60x",
    storageBucket: "clock-60x.firebasestorage.app",
    messagingSenderId: "311438870758",
    appId: "1:311438870758:web:41d7ec11bad3c924965327",
    measurementId: "G-JXQN631WTB"
};


const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(
        app
    );


/* =========================================
   DOM
========================================= */

const joinScreen =
    document.getElementById(
        "joinScreen"
    );

const appScreen =
    document.getElementById(
        "appScreen"
    );

const roomCodeInput =
    document.getElementById(
        "roomCode"
    );

const roomPasswordInput =
    document.getElementById(
        "roomPassword"
    );

const joinButton =
    document.getElementById(
        "joinButton"
    );

const joinStatus =
    document.getElementById(
        "joinStatus"
    );

const currentRoom =
    document.getElementById(
        "currentRoom"
    );

const connectionDot =
    document.getElementById(
        "connectionDot"
    );

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const leaveButton =
    document.getElementById(
        "leaveButton"
    );

const clock =
    document.getElementById(
        "clock"
    );

const clockStatus =
    document.getElementById(
        "clockStatus"
    );

const announcementList =
    document.getElementById(
        "announcementList"
    );

const addAnnouncementButton =
    document.getElementById(
        "addAnnouncementButton"
    );

const saveStatus =
    document.getElementById(
        "saveStatus"
    );


/* =========================================
   アプリ状態
========================================= */

let roomCode = null;

let roomData = null;

let unsubscribeRoom = null;

let announcements = [];


/* =========================================
   選択肢
========================================= */

const STATIONS = [
    "北春日部",
    "北越谷",
    "竹ノ塚"
];


const OPERATIONS = [
    "L1",
    "L2",
    "L3",
    "TH",
    "E1",
    "E2",
    "E3",
    "E4",
    "E5",
    "E6",
    "S1",
    "S2",
    "S3",
    "LM1",
    "LM2",
    "LM3",
    "LM4",
    "LM5",
    "LM6",
    "EM1",
    "EM2"
];


const TYPES = [
    "回送",
    "普通",
    "急行",
    "特急",
    "TH"
];


const TIME_TYPES = [
    "発車時刻",
    "入庫時刻"
];


const INSTRUCTIONS = [
    "列車を駅に待機させてください",
    "各駅員、列車の位置を共有してください"
];


/* =========================================
   保存キー
========================================= */

function getStorageKey() {

    return (
        "clock60x-say-" +
        roomCode
    );

}


/* =========================================
   新しい放送設定
========================================= */

function createAnnouncement() {

    return {

        id:
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .substring(2),

        enabled:
            true,

        time:
            "05:00:00",

        mode:
            "template",

        station:
            "北春日部",

        operation:
            "L1",

        type:
            "普通",

        timeType:
            "発車時刻",

        instruction:
            "列車を駅に待機させてください",

        comment:
            ""

    };

}


/* =========================================
   放送文章作成
========================================= */

function getAnnouncementText(data) {

    if (
        data.mode === "free"
    ) {

        return (
            data.comment ||
            "コメントがまだ入力されていません。"
        );

    }


    return (
        "まもなく、" +
        data.station +
        "車庫、" +
        data.operation +
        data.type +
        "、「" +
        data.timeType +
        "」です。" +
        "「" +
        data.instruction +
        "」。"
    );

}


/* =========================================
   保存
========================================= */

function saveAnnouncements() {

    if (!roomCode) {
        return;
    }


    localStorage.setItem(
        getStorageKey(),
        JSON.stringify(
            announcements
        )
    );


    saveStatus.textContent =
        "設定を保存しました";


    clearTimeout(
        saveAnnouncements.timer
    );


    saveAnnouncements.timer =
        setTimeout(
            () => {

                saveStatus.textContent =
                    "";

            },
            1200
        );

}


/* =========================================
   読み込み
========================================= */

function loadAnnouncements() {

    const raw =
        localStorage.getItem(
            getStorageKey()
        );


    if (!raw) {

        announcements = [];

        renderAnnouncements();

        return;

    }


    try {

        const data =
            JSON.parse(
                raw
            );


        if (
            !Array.isArray(data)
        ) {

            announcements = [];

        }
        else {

            announcements =
                data.map(
                    item => {

                        return {

                            ...createAnnouncement(),

                            ...item,

                            /*
                             * 古い形式でmodeが無い場合は
                             * 定型文にする。
                             */

                            mode:
                                item.mode === "free"
                                    ? "free"
                                    : "template",

                            time:
                                item.time ||
                                "05:00:00",

                            station:
                                item.station ||
                                "北春日部",

                            operation:
                                item.operation ||
                                "L1",

                            type:
                                item.type ||
                                "普通",

                            timeType:
                                item.timeType ||
                                "発車時刻",

                            instruction:
                                item.instruction ||
                                "列車を駅に待機させてください",

                            comment:
                                item.comment ||
                                ""

                        };

                    }
                );

        }

    }
    catch (error) {

        console.error(
            "放送設定の読み込みに失敗しました。",
            error
        );

        announcements = [];

    }


    renderAnnouncements();

}


/* =========================================
   SELECT作成
========================================= */

function createSelect(
    options,
    value,
    onChange
) {

    const select =
        document.createElement(
            "select"
        );


    options.forEach(
        optionValue => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                optionValue;

            option.textContent =
                optionValue;


            if (
                optionValue ===
                value
            ) {

                option.selected =
                    true;

            }


            select.appendChild(
                option
            );

        }
    );


    select.addEventListener(
        "change",
        () => {

            onChange(
                select.value
            );

        }
    );


    return select;

}


/* =========================================
   SELECT欄
========================================= */

function createSelectField(
    parent,
    labelText,
    options,
    value,
    onChange
) {

    const field =
        document.createElement(
            "div"
        );


    field.className =
        "card-field";


    const label =
        document.createElement(
            "label"
        );


    label.textContent =
        labelText;


    const select =
        createSelect(
            options,
            value,
            onChange
        );


    field.appendChild(
        label
    );


    field.appendChild(
        select
    );


    parent.appendChild(
        field
    );

}


/* =========================================
   選択ボタン
========================================= */

function createChoiceButton(
    parent,
    text,
    currentValue,
    onClick
) {

    const button =
        document.createElement(
            "button"
        );


    button.type =
        "button";


    button.className =
        "choice-button";


    if (
        text === currentValue
    ) {

        button.classList.add(
            "active"
        );

    }


    button.textContent =
        text;


    button.addEventListener(
        "click",
        () => {

            parent
                .querySelectorAll(
                    ".choice-button"
                )
                .forEach(
                    item => {

                        item.classList.remove(
                            "active"
                        );

                    }
                );


            button.classList.add(
                "active"
            );


            onClick(
                text
            );

        }
    );


    parent.appendChild(
        button
    );

}


/* =========================================
   カード描画
========================================= */

function renderAnnouncements() {

    announcementList.innerHTML =
        "";


    if (
        announcements.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.className =
            "empty-message";


        empty.textContent =
            "まだ放送設定がありません。" +
            "「＋ 放送設定を追加」から登録してください。";


        announcementList.appendChild(
            empty
        );


        return;

    }


    announcements.forEach(
        (data, index) => {

            const card =
                createAnnouncementCard(
                    data,
                    index
                );


            announcementList.appendChild(
                card
            );

        }
    );

}


/* =========================================
   カード
========================================= */

function createAnnouncementCard(
    data,
    index
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "announcement-card";


    /* ---------------------------------
       ヘッダー
    --------------------------------- */

    const header =
        document.createElement(
            "div"
        );


    header.className =
        "announcement-header";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "announcement-number";


    title.textContent =
        "放送設定 " +
        (index + 1);


    const right =
        document.createElement(
            "div"
        );


    right.className =
        "header-right";


    /* ON/OFF */

    const switchLabel =
        document.createElement(
            "label"
        );


    switchLabel.className =
        "switch";


    const checkbox =
        document.createElement(
            "input"
        );


    checkbox.type =
        "checkbox";


    checkbox.checked =
        data.enabled;


    const stateText =
        document.createElement(
            "span"
        );


    stateText.textContent =
        data.enabled
            ? "ON"
            : "OFF";


    checkbox.addEventListener(
        "change",
        () => {

            data.enabled =
                checkbox.checked;


            stateText.textContent =
                data.enabled
                    ? "ON"
                    : "OFF";


            saveAnnouncements();

        }
    );


    switchLabel.appendChild(
        checkbox
    );


    switchLabel.appendChild(
        stateText
    );


    /* 削除 */

    const deleteButton =
        document.createElement(
            "button"
        );


    deleteButton.className =
        "delete-button";


    deleteButton.textContent =
        "削除";


    deleteButton.addEventListener(
        "click",
        () => {

            if (
                !confirm(
                    "この放送設定を削除しますか？"
                )
            ) {

                return;

            }


            announcements =
                announcements.filter(
                    item =>
                        item.id !==
                        data.id
                );


            saveAnnouncements();

            renderAnnouncements();

        }
    );


    right.appendChild(
        switchLabel
    );


    right.appendChild(
        deleteButton
    );


    header.appendChild(
        title
    );


    header.appendChild(
        right
    );


    card.appendChild(
        header
    );


    /* ---------------------------------
       通知時刻
    --------------------------------- */

    const timeArea =
        document.createElement(
            "div"
        );


    timeArea.className =
        "time-area";


    const timeLabel =
        document.createElement(
            "div"
        );

/* =========================================
   時刻整形
========================================= */

function normalizeTime(time) {

    if (
        typeof time !==
        "string"
    ) {

        return "05:00:00";

    }


    const parts =
        time.split(":");


    if (
        parts.length === 2
    ) {

        return (
            time +
            ":00"
        );

    }


    if (
        parts.length === 3
    ) {

        return time;

    }


    return "05:00:00";

}


/* =========================================
   Clock
========================================= */

function formatTime(seconds) {

    const value =
        Math.floor(
            Number(
                seconds
            )
        );


    if (
        !Number.isFinite(
            value
        )
    ) {

        return "--:--:--";

    }


    const normalized =
        (
            (value % 86400) +
            86400
        ) % 86400;


    const h =
        Math.floor(
            normalized / 3600
        );


    const m =
        Math.floor(
            (normalized % 3600) / 60
        );


    const s =
        normalized % 60;


    return (
        String(h).padStart(2, "0") +
        ":" +
        String(m).padStart(2, "0") +
        ":" +
        String(s).padStart(2, "0")
    );

}


/* =========================================
   Clock更新
========================================= */

function updateClock() {

    if (!roomData) {
        return;
    }


    clock.textContent =
        formatTime(
            roomData.virtualSeconds
        );


    const running =
        Boolean(
            roomData.running
        );


    const speed =
        Number(
            roomData.speed || 1
        );


    if (running) {

        clockStatus.textContent =
            "Clock_60X運転中 ・ " +
            speed +
            "倍速";

    }
    else {

        clockStatus.textContent =
            "Clock_60X停止中";

    }

}


/* =========================================
   部屋参加
========================================= */

joinButton.addEventListener(
    "click",
    async () => {

        const inputRoomCode =
            roomCodeInput.value.trim();

        const password =
            roomPasswordInput.value;


        if (
            !/^\d{5}$/.test(
                inputRoomCode
            )
        ) {

            joinStatus.textContent =
                "部屋番号は5桁の数字で入力してください。";

            joinStatus.style.color =
                "#ff6b6b";

            return;

        }


        if (
            password.trim() === ""
        ) {

            joinStatus.textContent =
                "パスワードを入力してください。";

            joinStatus.style.color =
                "#ff6b6b";

            return;

        }


        joinButton.disabled =
            true;


        joinButton.textContent =
            "接続中...";


        joinStatus.textContent =
            "部屋を確認しています...";


        joinStatus.style.color =
            "#aaa";


        try {

            const roomRef =
                doc(
                    db,
                    "rooms",
                    inputRoomCode
                );


            const snapshot =
                await getDoc(
                    roomRef
                );


            if (
                !snapshot.exists()
            ) {

                joinStatus.textContent =
                    "その部屋は存在しません。";

                joinStatus.style.color =
                    "#ff6b6b";

                return;

            }


            const data =
                snapshot.data();


            if (
                data.password !==
                password
            ) {

                joinStatus.textContent =
                    "パスワードが違います。";

                joinStatus.style.color =
                    "#ff6b6b";

                return;

            }


            /* =========================
               参加成功
            ========================= */

            roomCode =
                inputRoomCode;


            roomData =
                data;


            currentRoom.textContent =
                roomCode;


            joinScreen.style.display =
                "none";


            appScreen.style.display =
                "block";


            connectionDot.classList.add(
                "online"
            );


            connectionStatus.textContent =
                "Clock_60Xと同期中";


            /*
             * 部屋ごとの設定を読み込む
             */

            loadAnnouncements();


            /*
             * Clock_60Xの部屋を監視
             */

            if (
                unsubscribeRoom
            ) {

                unsubscribeRoom();

            }


            unsubscribeRoom =
                onSnapshot(
                    roomRef,

                    snapshot => {

                        if (
                            !snapshot.exists()
                        ) {

                            connectionDot.classList.remove(
                                "online"
                            );


                            connectionStatus.textContent =
                                "部屋が削除されました";


                            return;

                        }


                        roomData =
                            snapshot.data();


                        connectionDot.classList.add(
                            "online"
                        );


                        connectionStatus.textContent =
                            "Clock_60Xと同期中";


                        updateClock();

                    },

                    error => {

                        console.error(
                            "Firestore監視エラー:",
                            error
                        );


                        connectionDot.classList.remove(
                            "online"
                        );


                        connectionStatus.textContent =
                            "接続エラー";

                    }
                );


            updateClock();

        }
        catch (error) {

            console.error(
                "部屋参加エラー:",
                error
            );


            joinStatus.textContent =
                "接続エラー\n\n" +
                error.message;


            joinStatus.style.color =
                "#ff6b6b";

        }
        finally {

            joinButton.disabled =
                false;


            joinButton.textContent =
                "部屋に参加";

        }

    }
);
